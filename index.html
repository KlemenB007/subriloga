<!doctype html>
<html lang="sl" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Subriloga">
<meta name="theme-color" content="#F3F7FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1115" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Subriloga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ================= TOKENS ================= */
:root{
  /* Subrident: modra RGB(98,175,224), siva RGB(96,96,98), bela */
  --brand:#62AFE0; --brand-grey:#606062;
  --bg:#F3F7FA; --bg-raised:#FFFFFF; --card:#FFFFFF; --card-hi:#F4F8FB;
  --line:#DCE5EC; --line-soft:#E9EFF4;
  --text:#23272C; --text-soft:#606062; --text-faint:#8B9299;
  --acc:#1F72AA; --acc-ink:#FFFFFF; --acc-soft:#E3F1FA; --acc-glow:rgba(98,175,224,.28);
  --ok:#1F8A5B; --ok-soft:#E1F3EA; --warn:#B26A0B; --warn-soft:#FCF0DC; --crit:#C8392E; --crit-soft:#FCE5E2;
  --info:#1F72AA; --info-soft:#E3F1FA; --mute-soft:#EEF2F5;
  --shadow:0 1px 2px rgba(30,50,70,.05),0 6px 20px rgba(30,50,70,.07);
  --shadow-lg:0 20px 50px rgba(20,40,60,.18);
  --nav-bg:rgba(255,255,255,.9);
  --glow1:rgba(98,175,224,.22); --glow2:rgba(96,96,98,.07);
  --r-lg:18px; --r-md:13px; --r-sm:9px;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --nav-h:66px;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0D1115; --bg-raised:#141A20; --card:#171D24; --card-hi:#1E262E;
  --line:#28323C; --line-soft:#1F2830;
  --text:#EEF3F7; --text-soft:#A7B2BC; --text-faint:#6F7B86;
  --acc:#62AFE0; --acc-ink:#06212F; --acc-soft:rgba(98,175,224,.14); --acc-glow:rgba(98,175,224,.35);
  --ok:#5CC592; --ok-soft:rgba(92,197,146,.14); --warn:#E9AE55; --warn-soft:rgba(233,174,85,.14); --crit:#F08377; --crit-soft:rgba(240,131,119,.14);
  --info:#62AFE0; --info-soft:rgba(98,175,224,.14); --mute-soft:rgba(160,175,190,.10);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shadow-lg:0 24px 60px rgba(0,0,0,.5);
  --nav-bg:rgba(20,26,32,.9);
  --glow1:rgba(98,175,224,.16); --glow2:rgba(96,96,98,.12);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){ html[data-theme="auto"]{
  --bg:#0D1115; --bg-raised:#141A20; --card:#171D24; --card-hi:#1E262E;
  --line:#28323C; --line-soft:#1F2830;
  --text:#EEF3F7; --text-soft:#A7B2BC; --text-faint:#6F7B86;
  --acc:#62AFE0; --acc-ink:#06212F; --acc-soft:rgba(98,175,224,.14); --acc-glow:rgba(98,175,224,.35);
  --ok:#5CC592; --ok-soft:rgba(92,197,146,.14); --warn:#E9AE55; --warn-soft:rgba(233,174,85,.14); --crit:#F08377; --crit-soft:rgba(240,131,119,.14);
  --info:#62AFE0; --info-soft:rgba(98,175,224,.14); --mute-soft:rgba(160,175,190,.10);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shadow-lg:0 24px 60px rgba(0,0,0,.5);
  --nav-bg:rgba(20,26,32,.9);
  --glow1:rgba(98,175,224,.16); --glow2:rgba(96,96,98,.12);
  color-scheme:dark;
}}

/* ================= BASE ================= */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg);overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;min-height:100vh;min-height:100dvh;padding-top:env(safe-area-inset-top);overflow-x:hidden}
body::before{content:"";position:fixed;inset:-2px;z-index:-1;pointer-events:none;background:
  radial-gradient(ellipse 90vw 50vh at 0% -8%,var(--glow1),transparent 70%),
  radial-gradient(ellipse 70vw 45vh at 105% 0%,var(--glow2),transparent 70%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.9em}
.muted{color:var(--text-soft)} .faint{color:var(--text-faint)} .small{font-size:13px} .xs{font-size:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.nowrap{white-space:nowrap}

.wrap{max-width:720px;margin:0 auto;padding:10px 16px calc(var(--nav-h) + 48px + env(safe-area-inset-bottom))}

/* ================= HEADER ================= */
.top{display:flex;align-items:center;gap:11px;padding:10px 2px 14px}
.logo-btn{display:flex;align-items:center;gap:11px;background:none;border:0;padding:0;color:inherit}
.logo-mark{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:block;box-shadow:0 4px 14px var(--acc-glow)}
.brand-name{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:0}
.brand-name b{color:var(--brand);font-weight:800}
.top .spacer{flex:1}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--text-soft);position:relative}
.icon-btn:active{transform:scale(.95)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--acc-soft);color:var(--acc);font-weight:800;display:grid;place-items:center;border:0;font-size:15px}
.sync-dot{position:absolute;right:-2px;top:-2px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--bg)}
.sync-dot.off{background:var(--warn)}

h1.page{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:4px 2px 4px}
.page-sub{margin:0 2px 18px;color:var(--text-soft);font-size:14px}
h2.sec{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);margin:26px 4px 10px;display:flex;align-items:center;gap:8px}
h2.sec .spacer{flex:1}
h2.sec .link{font-size:13px;text-transform:none;letter-spacing:0;font-weight:600;color:var(--acc);background:none;border:0;padding:0}

/* ================= CARDS ================= */
.card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-pad{padding:16px}
.list{display:flex;flex-direction:column;gap:10px}

.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px;color:#fff;background:linear-gradient(135deg,#4FA3D8 0%,#2D82BC 55%,#1E6399 100%);box-shadow:0 14px 34px rgba(31,114,170,.28)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}
.hero .hi{font-size:14px;opacity:.85;margin:0}
.hero .big{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:2px 0 14px;line-height:1.2}
.hero-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.hero-actions button{border:0;border-radius:14px;padding:12px 6px;background:rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:6px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hero-actions button.main{background:#fff;color:#1E6399}
.hero-actions button:active{transform:scale(.96)}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.tile{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:14px 15px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:0}
button.tile:active{transform:scale(.98)}
.tile .t-l{font-size:12.5px;color:var(--text-soft);font-weight:600;display:flex;align-items:center;gap:6px}
.tile .t-v{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .t-s{font-size:12px;color:var(--text-faint)}
.tile.crit .t-v{color:var(--crit)} .tile.warn .t-v{color:var(--warn)} .tile.ok .t-v{color:var(--ok)}
.tile .t-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.tile.crit .t-ic{background:var(--crit-soft);color:var(--crit)} .tile.warn .t-ic{background:var(--warn-soft);color:var(--warn)} .tile.ok .t-ic{background:var(--ok-soft);color:var(--ok)}

/* guide card */
.guide-card{display:flex;gap:14px;align-items:center;padding:14px 16px;margin-top:14px;width:100%;text-align:left;border:1px solid var(--line-soft)}
.ring{--p:0;width:52px;height:52px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--line-soft) 0)}
.ring span{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:13px}
.guide-card .g-t{font-weight:700}
.guide-card .g-s{font-size:13px;color:var(--text-soft)}

/* entries (items) */
.entry{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-lg);position:relative;overflow:hidden;box-shadow:var(--shadow)}
.entry::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--spine,var(--brand));opacity:.9}
.entry.s-crit{--spine:var(--crit)} .entry.s-warn{--spine:var(--warn)} .entry.s-ok{--spine:var(--ok)} .entry.s-info{--spine:var(--info)} .entry.s-mute{--spine:var(--line)}
.entry-main{display:flex;gap:12px;align-items:center;padding:13px 12px 13px 15px;cursor:pointer;background:none;border:0;width:100%;text-align:left;color:inherit}
.av{width:44px;height:44px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:-.02em;background:var(--tint-bg,var(--acc-soft));color:var(--tint,var(--acc))}
.e-info{flex:1;min-width:0}
.e-title{font-weight:700;font-size:15.5px;line-height:1.25;margin:0;overflow-wrap:anywhere}
.e-sub{font-size:12.5px;color:var(--text-soft);margin:2px 0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.e-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.e-stock{text-align:right;flex-shrink:0;padding-left:4px}
.e-stock .q{font-size:19px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.e-stock .u{font-size:11.5px;color:var(--text-faint)}
.e-quick{display:flex;flex-direction:column;gap:6px;padding:10px 12px 10px 0;justify-content:center}
.qbtn{width:36px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--card-hi);display:grid;place-items:center;color:var(--text-soft)}
.qbtn:active{transform:scale(.93)}
.qbtn.minus{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}

.meter{height:5px;border-radius:5px;background:var(--line-soft);overflow:hidden;position:relative;width:100%;max-width:160px}
.meter i{display:block;height:100%;border-radius:5px;background:var(--ok)}
.meter.warn i{background:var(--warn)} .meter.crit i{background:var(--crit)}
.meter b{position:absolute;top:0;bottom:0;width:2px;background:var(--text-faint)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:100px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.mute{background:var(--mute-soft);color:var(--text-soft)}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:7px;background:var(--mute-soft);color:var(--text-soft);font-weight:600}
.tag.best{background:var(--ok-soft);color:var(--ok)}

/* simple rows */
.rowcard{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line-soft);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:inherit}
.rowcard:last-child{border-bottom:0}
button.rowcard:active{background:var(--card-hi)}
.rowcard .grow{flex:1;min-width:0}
.rowcard .t{font-weight:650;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowcard .s{font-size:12.5px;color:var(--text-soft)}
.rowcard .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);flex-shrink:0}
.rowcard .ic.ok{background:var(--ok-soft);color:var(--ok)} .rowcard .ic.crit{background:var(--crit-soft);color:var(--crit)} .rowcard .ic.warn{background:var(--warn-soft);color:var(--warn)} .rowcard .ic.mute{background:var(--mute-soft);color:var(--text-soft)}

/* search + chips */
.search-bar{position:relative;margin-bottom:12px}
.search-bar svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--text-faint);pointer-events:none}
.search-bar input[type=search]{width:100%;padding:13px 15px 13px 44px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);font-size:16px;box-shadow:var(--shadow)}
.search-bar input:focus{outline:none;border-color:var(--acc)}
.chip-row{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;margin:0 -2px 12px}
.chip-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 13px;border-radius:100px;border:1px solid var(--line);background:var(--card);color:var(--text-soft);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.chip .c{opacity:.65;font-size:11.5px;margin-left:3px}
.chip.crit.on{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.chip.warn.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);font-weight:700;font-size:15px;color:var(--text);text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);box-shadow:0 6px 18px var(--acc-glow)}
.btn.soft{background:var(--acc-soft);border-color:transparent;color:var(--acc)}
.btn.danger{color:var(--crit)}
.btn.ghost{background:none;border-color:transparent;color:var(--text-soft)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:9px;margin-top:18px}
.btns .btn{flex:1}

/* empty */
.empty{padding:26px 18px;text-align:center;color:var(--text-soft)}
.empty .e-ic{width:52px;height:52px;border-radius:16px;margin:0 auto 10px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.empty b{display:block;color:var(--text);font-size:15.5px;margin-bottom:3px}

/* ================= NAV ================= */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--nav-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line-soft);display:flex;justify-content:center}
.nav-inner{width:100%;max-width:720px;height:var(--nav-h);display:flex;align-items:center;justify-content:space-around;padding:0 8px}
.nav-btn{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-faint);font-size:10.5px;font-weight:600;padding:6px 4px;flex:1;min-width:0;position:relative}
.nav-btn.on{color:var(--acc)}
.nav-btn .badge{position:absolute;top:1px;left:calc(50% + 6px);background:var(--crit);color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:0 5px;line-height:16px;min-width:16px;text-align:center}
.nav-add{width:54px;height:54px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;box-shadow:0 8px 22px var(--acc-glow);flex-shrink:0;margin:0 6px;transform:translateY(-8px)}
.nav-add:active{transform:translateY(-8px) scale(.92)}

/* ================= SHEETS ================= */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,18,26,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fade .22s ease}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg-raised);width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:6px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;max-height:92dvh;overflow:hidden auto;overscroll-behavior:contain;border-top:1px solid var(--line);animation:rise .38s cubic-bezier(.16,1,.3,1);box-shadow:var(--shadow-lg)}
@keyframes rise{from{transform:translateY(100%)}}
.handle{width:40px;height:5px;background:var(--line);border-radius:100px;margin:8px auto 14px}
.sheet h2{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.sheet .sh-sub{color:var(--text-soft);font-size:13.5px;margin:0 0 16px}
.sheet-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.sheet-head .grow{flex:1;min-width:0}
.x-btn{width:34px;height:34px;border-radius:50%;border:0;background:var(--mute-soft);color:var(--text-soft);display:grid;place-items:center;flex-shrink:0}
@media (min-width:760px){
  .overlay{align-items:center;padding:24px}
  .sheet{border-radius:24px;max-height:88vh;border:1px solid var(--line)}
  .handle{display:none}
  .sheet{padding-top:20px}
}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:650;color:var(--text-soft)}
.field .help{font-size:12px;color:var(--text-faint)}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=url],input[type=search],select,textarea{width:100%;min-width:0;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea{resize:vertical;min-height:100px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.more-toggle{display:flex;align-items:center;gap:8px;background:none;border:0;padding:12px 0 4px;color:var(--acc);font-weight:700;font-size:14px}
.more-toggle svg{transition:transform .2s}
.more-toggle.open svg{transform:rotate(180deg)}
.seg{display:flex;background:var(--mute-soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px 8px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--text-soft)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

.stepper{display:flex;align-items:center;gap:10px;justify-content:center;margin:8px 0}
.stepper button{width:56px;height:56px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:26px;font-weight:600;color:var(--acc);display:grid;place-items:center}
.stepper button:active{transform:scale(.94)}
.stepper input{width:120px;text-align:center;font-size:30px;font-weight:800;padding:8px;border-radius:16px;font-variant-numeric:tabular-nums}
.quickq{display:flex;gap:8px;justify-content:center;margin-bottom:6px}
.quickq button{border:1px solid var(--line);background:var(--card);border-radius:100px;padding:6px 14px;font-weight:700;font-size:13px;color:var(--text-soft)}

.picked{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--card-hi);border:1px solid var(--line-soft);margin-bottom:10px}
.picked .grow{flex:1;min-width:0}
.pick-list{display:flex;flex-direction:column;max-height:46vh;overflow:auto;border:1px solid var(--line-soft);border-radius:16px;background:var(--card)}
.pick-item{display:flex;gap:11px;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid var(--line-soft);background:none;text-align:left;width:100%;color:inherit}
.pick-item:last-child{border-bottom:0}
.pick-item:active{background:var(--card-hi)}
.pick-item .av{width:36px;height:36px;border-radius:10px;font-size:12px}
.pick-item .grow{flex:1;min-width:0}
.pick-item .t{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-item .s{font-size:12px;color:var(--text-soft)}
.pick-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);padding:10px 12px 4px}

.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.statgrid div{background:var(--card-hi);border-radius:12px;padding:10px 11px}
.statgrid dt{font-size:11.5px;color:var(--text-faint);font-weight:600}
.statgrid dd{margin:2px 0 0;font-weight:800;font-size:15.5px;font-variant-numeric:tabular-nums}
.sec-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);margin:18px 0 8px}
.lotrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.lotrow:last-child{border-bottom:0}
.mailbox{white-space:pre-wrap;background:var(--card-hi);border:1px solid var(--line-soft);border-radius:14px;padding:14px;font-size:13.5px;margin:0;user-select:text;font-family:var(--font)}
.confirm{background:var(--crit-soft);border-radius:12px;padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--text);font-size:14px;margin-top:10px}
.banner{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--warn-soft);color:var(--text);margin-bottom:14px;font-size:13.5px}
.banner>span:not(.spacer){flex:1;min-width:0}.banner .spacer{display:none}
.banner b{color:var(--warn)}

/* order lines */
.oline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:12px 0;border-bottom:1px solid var(--line-soft);align-items:center}
.oline:last-child{border-bottom:0}
.oline .inputs{display:flex;gap:6px;align-items:center;grid-column:1/-1}
.oline .inputs input{padding:9px 10px;font-size:15px}
.oline .inputs label{font-size:11.5px;color:var(--text-faint);font-weight:600}

/* charts */
.chart{position:relative;padding:10px 0 0 40px}
.chart .plot{position:relative;height:170px;border-bottom:1px solid var(--line)}
.chart .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line-soft)}
.chart .gl span{position:absolute;right:calc(100% + 7px);top:-8px;font-size:10.5px;color:var(--text-faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.chart .bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:3px}
.chart .col{flex:1 1 0;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;border:0;background:none;padding:0 3px}
.chart .col i{display:block;flex:1 1 auto;max-width:34px;background:linear-gradient(180deg,var(--brand),color-mix(in srgb,var(--brand) 70%,#1E6399));border-radius:6px 6px 2px 2px;min-height:2px}
.chart .col.cur i{background:var(--acc-soft);outline:1.5px dashed var(--brand);outline-offset:-1.5px}
.chart .xl{display:flex;gap:3px;margin-top:6px}
.chart .xl span{flex:1;text-align:center;font-size:11px;color:var(--text-faint);overflow:hidden;white-space:nowrap}
.hbars{display:flex;flex-direction:column;gap:11px}
.hb .top-l{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin-bottom:5px}
.hb .top-l span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.hb .top-l span:last-child{font-variant-numeric:tabular-nums;color:var(--text-soft);font-weight:600}
.hb .t{height:8px;background:var(--line-soft);border-radius:8px;overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--brand);border-radius:8px}
.spark{display:flex;align-items:flex-end;gap:4px;height:46px}
.spark i{flex:1;background:var(--acc-soft);border-radius:4px 4px 2px 2px;min-height:2px}
.spark i:last-child{background:var(--brand)}
#tip{position:fixed;pointer-events:none;background:var(--text);color:var(--bg);padding:6px 9px;border-radius:8px;font-size:12px;font-weight:600;z-index:70;white-space:nowrap}

/* guide */
.lesson{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.lesson-head{display:flex;gap:12px;align-items:center;padding:14px 14px;width:100%;background:none;border:0;text-align:left;color:inherit}
.lesson .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13.5px;flex-shrink:0;border:2px solid var(--line);color:var(--text-soft)}
.lesson.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.lesson.next .n{border-color:var(--acc);color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
.lesson .lt{font-weight:700;font-size:15px}
.lesson.done .lt{color:var(--text-soft)}
.lesson .ls{font-size:12.5px;color:var(--text-faint)}
.lesson-body{padding:0 16px 16px 58px;display:none}
.lesson.open .lesson-body{display:block}
.lesson-body p{margin:0 0 10px;color:var(--text-soft);font-size:14px}
.lesson-body ol{margin:0 0 12px;padding-left:18px;font-size:14px}
.lesson-body li{margin:3px 0}
.chev{transition:transform .2s;color:var(--text-faint)}
.lesson.open .chev{transform:rotate(180deg)}

/* spotlight */
.spot-veil{position:fixed;inset:0;z-index:60}
.spot{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(8,16,24,.62),0 0 0 3px var(--brand);transition:all .3s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.spot-tip{position:fixed;z-index:61;max-width:300px;background:var(--bg-raised);color:var(--text);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.spot-tip b{display:block;margin-bottom:3px}
.spot-tip p{margin:0 0 10px;font-size:14px;color:var(--text-soft)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;z-index:80;font-weight:650;font-size:14px;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px);text-align:center}

/* settings list */
.menu{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}

/* login */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.login .card{width:min(400px,100%);padding:28px 22px;display:flex;flex-direction:column;gap:14px}
.login .logo-mark{width:56px;height:56px;border-radius:16px}
.login h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.03em}
.login p{margin:0;color:var(--text-soft)}
.login .err{color:var(--crit);font-size:13.5px;min-height:1em}
.loading{padding:80px 0;text-align:center;color:var(--text-soft)}

/* desktop */
@media (min-width:980px){
  .wrap{max-width:1040px;padding-inline:28px}
  .two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 20px;align-items:start}
  .list.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .hero{padding:26px}
  .hero-actions{max-width:520px}
}
@media (max-width:380px){ .fgrid{grid-template-columns:minmax(0,1fr)} .statgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

const snake = k => k.replace(/[A-Z]/g, c => "_" + c.toLowerCase());
const camel = k => k.replace(/_([a-z])/g, (m, c) => c.toUpperCase());
const toRow = o => { const r = {}; Object.entries(o).forEach(([k, v]) => { if (v !== undefined) r[snake(k)] = v; }); return r; };
const fromRow = r => { const o = {}; Object.entries(r).forEach(([k, v]) => o[camel(k)] = v); return o; };
function applyLocal(coll, rec, remove) {
  const arr = S()[coll]; const i = arr.findIndex(x => x.id === rec.id);
  if (remove) { if (i >= 0) arr.splice(i, 1); }
  else if (i >= 0) arr[i] = Object.assign({}, arr[i], rec); else arr.push(rec);

}
function check(res) { if (res.error) { const e = new Error(res.error.message); e.code = res.error.code === "42501" ? "denied" : "db"; e.detail = res.error; throw e; } return res; }

async function fetchAll(table) {

}

let M = null;
function derive() {
  const s = S(), st = settings();
  const byId = {}; s.items.forEach(i => byId[i.id] = i);
  const sup = {}; s.suppliers.forEach(x => sup[x.id] = x);
  const now = Date.now();
  const res = {byId, sup, it: {}};
  const onOrder = {};
  s.orders.filter(o => o.status === "sent").forEach(o => (o.lines || []).forEach(l => { onOrder[l.itemId] = (onOrder[l.itemId] || 0) + num(l.packs) * (num(l.packSize) || 1); }));
  const lastIn = {}, out90 = {}, freq = {}; let firstMove = now;
  s.moves.forEach(m => {
    const t = new Date(m.date).getTime(); if (t < firstMove) firstMove = t;
    if (m.type === "in" && num(m.unitPrice) > 0) { if (!lastIn[m.itemId] || lastIn[m.itemId].date < m.date) lastIn[m.itemId] = m; }
    if (m.type === "out" && now - t <= 90 * DAY) { out90[m.itemId] = (out90[m.itemId] || 0) + num(m.qty); freq[m.itemId] = (freq[m.itemId] || 0) + 1; }
  });
  const spanDays = Math.max(14, Math.min(90, (now - firstMove) / DAY));
  const offersBy = {}; s.offers.forEach(o => { (offersBy[o.itemId] = offersBy[o.itemId] || []).push(Object.assign({}, o, {unit: num(o.price) / (num(o.packSize) || 1)})); });
  Object.values(offersBy).forEach(a => a.sort((a, b) => a.unit - b.unit));
  const lotsBy = {}; s.lots.forEach(l => { if (num(l.qty) > 0) (lotsBy[l.itemId] = lotsBy[l.itemId] || []).push(l); });
  const fefo = (a, b) => (a.expiry || "9999") < (b.expiry || "9999") ? -1 : (a.expiry || "9999") > (b.expiry || "9999") ? 1 : (a.receivedAt || "") < (b.receivedAt || "") ? -1 : 1;
  let totalValue = 0;
  s.items.forEach(item => {
    const lots = (lotsBy[item.id] || []).sort(fefo);
    const stock = lots.reduce((a, l) => a + num(l.qty), 0);
    const offers = offersBy[item.id] || [];
    const best = offers[0] || null;
    const unitCost = lastIn[item.id] ? num(lastIn[item.id].unitPrice) : best ? best.unit : num(item.price);
    const value = lots.reduce((a, l) => a + num(l.qty) * (num(l.price) || unitCost), 0);
    totalValue += value;
    const daily = (out90[item.id] || 0) / spanDays;
    const daysLeft = daily > 0 ? stock / daily : Infinity;
    const min = num(item.minQty), target = num(item.targetQty) || Math.max(min * 2, 1);
    const prefSup = sup[item.supplierId] || (best && sup[best.supplierId]) || null;
    const lead = num(prefSup && prefSup.deliveryDays) || 3;
    const oo = onOrder[item.id] || 0;
    const expLots = lots.filter(l => l.expiry && daysUntil(l.expiry) <= st.warnDays);
    let status = "ok", label = "V redu";
    const proj = stock + oo;
    if (stock <= 0 && oo <= 0) { status = "crit"; label = "Ni zaloge"; }
    else if (proj <= min && min > 0) { status = "crit"; label = "Naroči"; }
    else if (daily > 0 && proj / daily < lead + num(st.safetyDays)) { status = "warn"; label = "Kmalu naroči"; }
    else if (min === 0 && !daily) { status = "mute"; label = "Brez minimuma"; }
    if (oo > 0 && status !== "crit" && status !== "warn") { status = "info"; label = "Naročeno"; }
    const need = (status === "crit" || status === "warn") ? Math.max(0, target - proj) : 0;
    const ps = num(best ? best.packSize : item.packSize) || num(item.packSize) || 1;
    const packs = need > 0 ? Math.ceil(need / ps) : 0;
    res.it[item.id] = {item, lots, stock, value, unitCost, daily, monthly: daily * 30, daysLeft, min, target, status, label, onOrder: oo, need, packs, packSize: ps, best, offers, supplier: prefSup, orderSupplier: (best && sup[best.supplierId]) || prefSup, expLots, freq: freq[item.id] || 0};
  });
  res.totalValue = totalValue;
  res.list = Object.values(res.it);
  res.reorder = res.list.filter(x => x.status === "crit" || x.status === "warn");
  res.expiring = [];
  res.list.forEach(x => x.expLots.forEach(l => res.expiring.push({x, l, d: daysUntil(l.expiry)})));
  res.expiring.sort((a, b) => a.d - b.d);
  res.frequent = res.list.filter(x => x.freq > 0).sort((a, b) => b.freq - a.freq).slice(0, 8);
  return res;
}
function monthly() {
  const s = S(), agg = {};
  const g = k => agg[k] = agg[k] || {out: {}, in: {}, waste: {}, sup: {}};
  const add = (o, id, q, v) => { o[id] = o[id] || {q: 0, v: 0}; o[id].q += q; o[id].v += v; };
  s.moves.forEach(m => {
    const k = monthKey(m.date), a = g(k), q = Math.abs(num(m.qty)), v = q * num(m.unitPrice);
    if (m.type === "out") add(a.out, m.itemId, q, v);
    else if (m.type === "waste") add(a.waste, m.itemId, q, v);
    else if (m.type === "in") { add(a.in, m.itemId, q, v); if (m.supplierId) a.sup[m.supplierId] = (a.sup[m.supplierId] || 0) + v; }
  });
  s.archive.forEach(ar => {
    const a = g(ar.month);
    Object.entries(ar.items || {}).forEach(([id, r]) => { add(a.out, id, num(r.out), num(r.outVal)); add(a.in, id, num(r.in), num(r.inVal)); add(a.waste, id, num(r.waste), num(r.wasteVal)); });
    Object.entries(ar.bySupplier || {}).forEach(([sid, v]) => a.sup[sid] = (a.sup[sid] || 0) + num(v));
  });
  return agg;
}

function niceMax(v) { if (v <= 0) return 100; const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }

    <div class="xl">${data.map(d => `<span>${monthLabel(d.k).split(" ")[0]}</span>`).join("")}</div></div>`;
}
VIEWS.stats = () => {
  const n = ui.statsRange, months = lastMonths(n), agg = monthly(), cur = monthKey(today());

  const tot = {out: 0, in: 0, waste: 0}, byItem = {}, byCat = {}, bySup = {};
  months.forEach(k => { const a = agg[k]; if (!a) return;
    Object.entries(a.out).forEach(([id, r]) => { tot.out += r.v; byItem[id] = byItem[id] || {q: 0, v: 0, w: 0}; byItem[id].q += r.q; byItem[id].v += r.v; const c = (M.byId[id] || {}).category || "Drugo"; byCat[c] = (byCat[c] || 0) + r.v; });
    Object.values(a.in).forEach(r => tot.in += r.v);
    Object.entries(a.waste).forEach(([id, r]) => { tot.waste += r.v; byItem[id] = byItem[id] || {q: 0, v: 0, w: 0}; byItem[id].w += r.v; });
    Object.entries(a.sup).forEach(([sid, v]) => bySup[sid] = (bySup[sid] || 0) + v);
  });

  const fm = full, half = Math.floor(fm.length / 2), m1 = fm.slice(0, half), m2 = fm.slice(half);
  const trend = id => { const a = m1.reduce((s, k) => s + ((((agg[k] || {}).out || {})[id]) || {q: 0}).q, 0) / (m1.length || 1), b = m2.reduce((s, k) => s + ((((agg[k] || {}).out || {})[id]) || {q: 0}).q, 0) / (m2.length || 1); if (!a && !b) return ""; if (!a) return '<span class="pill info">novo</span>'; const p = (b / a - 1) * 100; return `<span class="pill ${p > 15 ? "warn" : p < -15 ? "ok" : "mute"}">${p > 0 ? "▲" : p < 0 ? "▼" : ""} ${nf0.format(Math.abs(p))} %</span>`; };

  const top = Object.entries(byItem).filter(([id]) => M.byId[id]).sort((a, b) => b[1].v - a[1].v);
  return `<h1 class="page">Statistika</h1><p class="page-sub">Vrednost porabe po nabavni ceni serije, iz katere je bil material porabljen.</p>
  <div class="row" style="margin-bottom:14px"><div class="seg" style="flex:1;max-width:320px" data-tour="range">${[3, 6, 12].map(r => `<button data-range="${r}" aria-pressed="${n === r}">${r} mesecev</button>`).join("")}</div><button class="btn sm" data-act="export-usage">${ic("down", 16)} CSV</button></div>
  <div class="tiles" style="margin-top:0">
    <div class="tile"><span class="t-l">Poraba</span><span class="t-v">${eur0.format(tot.out)}</span><span class="t-s">${n} mesecev</span></div>
    <div class="tile"><span class="t-l">Povprečno / mesec</span><span class="t-v">${eur0.format(avg)}</span><span class="t-s">zaključeni meseci</span></div>
    <div class="tile"><span class="t-l">Nabava</span><span class="t-v">${eur0.format(tot.in)}</span><span class="t-s">prevzet material</span></div>
    <div class="tile ${tot.waste ? "warn" : ""}"><span class="t-l">Odpis</span><span class="t-v">${eur0.format(tot.waste)}</span><span class="t-s">${tot.out ? nf.format(tot.waste / (tot.out + tot.waste) * 100) + " % porabe" : "potekel, poškodovan"}</span></div>

  closeSpot();

  setTimeout(() => {
    const r = el.getBoundingClientRect(), pad = 6;
    const veil = document.createElement("div"); veil.className = "spot-veil"; veil.id = "spotVeil";
    veil.innerHTML = `<div class="spot" style="left:${r.left - pad}px;top:${r.top - pad}px;width:${r.width + pad * 2}px;height:${r.height + pad * 2}px"></div>`;
    const tip = document.createElement("div"); tip.className = "spot-tip"; tip.id = "spotTip";
    tip.innerHTML = `<b>${esc(title || "Tukaj")}</b><p>${esc(text)}</p><button class="btn primary sm" id="spotOk">Razumem</button>`;

    const tw = Math.min(300, innerWidth - 32), below = r.bottom + 14 + 140 < innerHeight;

    const close = () => closeSpot();

}

/* stock ops */
async function addStock({itemId, qty, lot, expiry, price, supplierId, note, orderId, initial, date}) {
  const lotId = uid(), d = date || today();
  return safe(async () => {
    await put("lots", lotId, {itemId, lot: lot || "", expiry: expiry || "", qty, price: price || 0, receivedAt: d, supplierId: supplierId || ""});
    if (!initial) await put("moves", uid(), {itemId, type: "in", qty, unitPrice: price || 0, lot: lot || "", expiry: expiry || "", supplierId: supplierId || "", date: d, ts: new Date().toISOString(), byUser: ME || "", note: note || "", orderId: orderId || ""});
  });
}
async function takeStock(itemId, qty, type, note, specificLotId) {
  const x = M.it[itemId]; let left = qty; const touched = [];
  const lots = specificLotId ? x.lots.filter(l => l.id === specificLotId) : x.lots;
  for (const l of lots) { if (left <= 0) break; const t = Math.min(num(l.qty), left); left -= t; touched.push({l, t}); }
  const taken = qty - left; if (taken <= 0) { toast("Tega materiala ni na zalogi."); return false; }
  const value = touched.reduce((a, r) => a + r.t * (num(r.l.price) || x.unitCost), 0);
  return safe(async () => {
    for (const r of touched) { const rest = num(r.l.qty) - r.t; if (rest <= 1e-9) await del("lots", r.l.id); else await patch("lots", r.l.id, {qty: Math.round(rest * 1000) / 1000}); }
    await put("moves", uid(), {itemId, type, qty: taken, unitPrice: Math.round(value / taken * 10000) / 10000, lot: touched.map(r => r.l.lot).filter(Boolean).join(", "), date: today(), ts: new Date().toISOString(), byUser: ME || "", note: note || ""});
  }, left > 0 ? `Zabeleženo ${nf.format(taken)} (več ni bilo na zalogi)` : null);
}

/* orders */
async function draftFrom(sid) {
  const lines = M.reorder.filter(x => x.orderSupplier && x.orderSupplier.id === sid).map(x => {
    const o = x.offers.find(z => z.supplierId === sid);
    return {itemId: x.item.id, packs: x.packs || 1, packSize: o ? num(o.packSize) || 1 : x.packSize, packPrice: o ? num(o.price) : Math.round(x.unitCost * x.packSize * 100) / 100, code: (o && o.code) || x.item.code || ""};
  });
  const id = uid();
  if (await safe(() => put("orders", id, {supplierId: sid, status: "draft", lines, createdAt: today()}))) { M = derive(); orderOpen(id); }
}
function mailText(o) {
  const st = settings(), sp = M.sup[o.supplierId] || {};
  const list = (o.lines || []).map(l => { const it = M.byId[l.itemId] || {name: "?"}; return `- ${it.name}${l.code ? " (šifra " + l.code + ")" : ""}: ${nf.format(num(l.packs))} × pakiranje ${nf.format(num(l.packSize))} ${it.unit || ""}`; }).join("\n");
  const rep = {dobavitelj: sp.name || "", kontakt: sp.contact || "", seznam: list, ordinacija: st.clinic || "", naslov: st.address || "", podpis: st.signature || "", telefon: st.phone || "", datum: fmtDate(today()), skupaj: eur.format(orderTotal(o))};
  const txt = (st.template || DEFAULT_TEMPLATE).replace(/\{(\w+)\}/g, (m, k) => k in rep ? rep[k] : m).replace(/\n{3,}/g, "\n\n").trim();
  const mm = txt.match(/^Zadeva:\s*(.*)\n+/i);
  return mm ? {subject: mm[1], body: txt.slice(mm[0].length)} : {subject: "Naročilo materiala", body: txt};
}
async function sendOrder(id) {
  const o = S().orders.find(z => z.id === id); const sp = M.sup[o.supplierId];
  const lines = readLines(o).filter(l => l.packs > 0);
  if (!lines.length) return toast("Naročilo je prazno.");
  const draft = Object.assign({}, o, {lines}); const mt = mailText(draft);
  if (demo) { await patch("orders", id, {lines, status: "sent", sentAt: today()}); closeSheet(); return toast("Vadnica: naročilo bi bilo poslano na " + sp.email); }
  try {
    const {data, error} = await SB.functions.invoke("poslji-narocilo", {body: {orderId: id, to: sp.email, subject: mt.subject, text: mt.body}});
    if (error || !data || !data.ok) throw new Error((data && data.error) || (error && error.message) || "napaka");
    await patch("orders", id, {lines, status: "sent", sentAt: today()});
    closeSheet(); toast("Naročilo poslano ✓");
  } catch (e) {
    console.error(e);
    const z = $("#sendZone"); if (z) z.innerHTML = `<div class="confirm"><span>Pošiljanje ni uspelo (${esc(e.message)}). Kopiraj besedilo in ga pošlji ročno, ali preveri nastavitve SMTP.</span></div>`;
  }
}
function readLines(o) { return (o.lines || []).map((l, k) => { const p = $("#ol_p" + k), c = $("#ol_c" + k); return Object.assign({}, l, {packs: p ? num(p.value) : l.packs, packPrice: c ? num(c.value) : l.packPrice}); }); }
function orderOpen(id) {
  const o = S().orders.find(z => z.id === id); if (!o) return closeSheet();

}

const SERIES = () => { const dark = getComputedStyle(document.documentElement).getPropertyValue("color-scheme").trim() === "dark"; return dark ? ["#62AFE0", "#3CC3A8", "#E9AE55", "#A99BF2", "#A7B2BC"] : ["#2D82BC", "#138A7E", "#C27C0E", "#6B5BD6", "#606062"]; };
function priceSeries(itemId) {
  const pts = [];
  S().moves.forEach(m => { if (m.itemId === itemId && m.type === "in" && num(m.unitPrice) > 0) pts.push({date: m.date, v: num(m.unitPrice), sid: m.supplierId || "_", src: "Prevzem"}); });
  (S().price_history || []).forEach(h => { if (h.itemId === itemId && num(h.unitPrice) > 0) pts.push({date: h.date, v: num(h.unitPrice), sid: h.supplierId || "_", src: "Ponudba"}); });
  pts.sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  const by = {}; pts.forEach(p => (by[p.sid] = by[p.sid] || []).push(p));
  const order = Object.keys(by).sort((a, b) => by[b].length - by[a].length);
  return {pts, by, order};
}
function priceChange(itemId, months = 12) {
  const {pts} = priceSeries(itemId); const from = new Date(); from.setMonth(from.getMonth() - months); const f = from.toISOString().slice(0, 10);
  const r = pts.filter(p => p.date >= f); if (r.length < 2) return null;
  return (r[r.length - 1].v / r[0].v - 1) * 100;
}
function drawPriceChart(el, itemId, unit) {
  const {pts, by, order} = priceSeries(itemId);
  if (pts.length < 2) { el.innerHTML = `<p class="small muted" style="margin:0">Zgodovina se gradi sama – vsak prevzem s ceno in vsaka sprememba ponudbe doda točko.</p>`; return; }
  const cols = SERIES(), W = Math.max(260, el.clientWidth || 320), H = 170, L = 46, R = 10, T = 10, B = 24;
  const t0 = new Date(pts[0].date).getTime(), t1 = Math.max(new Date(pts[pts.length - 1].date).getTime(), t0 + DAY);
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v)); const pad = (hi - lo) * .15 || hi * .1; lo = Math.max(0, lo - pad); hi = hi + pad;
  const x = d => L + (new Date(d).getTime() - t0) / (t1 - t0) * (W - L - R), y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = [lo, (lo + hi) / 2, hi];
  const fmt = v => v < 1 ? v.toLocaleString("sl-SI", {minimumFractionDigits: 3, maximumFractionDigits: 3}) + " €" : eur.format(v);
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Zgodovina cene">`;
  ticks.forEach(v => { svg += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-soft)" stroke-dasharray="3 3"/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end" font-size="10.5" fill="var(--text-faint)">${esc(fmt(v))}</text>`; });
  [pts[0].date, pts[pts.length - 1].date].forEach((d, k) => { svg += `<text x="${k ? W - R : L}" y="${H - 6}" text-anchor="${k ? "end" : "start"}" font-size="10.5" fill="var(--text-faint)">${esc(fmtShort(d))}</text>`; });
  order.slice(0, 5).forEach((sid, k) => {
    const s = by[sid], c = cols[k];
    if (s.length > 1) svg += `<polyline fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${s.map(p => x(p.date).toFixed(1) + "," + y(p.v).toFixed(1)).join(" ")}"/>`;
    s.forEach(p => { svg += `<circle cx="${x(p.date).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="4.5" fill="${c}" stroke="var(--bg-raised)" stroke-width="2" data-tip="${esc(((M.sup[sid] || {}).name || "Brez dobavitelja") + " · " + fmtShort(p.date) + " · " + fmt(p.v) + "/" + unit + " (" + p.src + ")")}"/><circle cx="${x(p.date).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="12" fill="transparent" data-tip="${esc(((M.sup[sid] || {}).name || "Brez dobavitelja") + " · " + fmtShort(p.date) + " · " + fmt(p.v) + "/" + unit)}"/>`; });
  });
  svg += `</svg>`;
  const legend = order.slice(0, 5).map((sid, k) => { const s = by[sid], last = s[s.length - 1].v, first = s[0].v, ch = s.length > 1 ? (last / first - 1) * 100 : 0; return `<span class="row" style="gap:6px;flex-wrap:nowrap"><i style="width:10px;height:10px;border-radius:3px;background:${cols[k]};display:inline-block"></i><span class="small" style="font-weight:600">${esc((M.sup[sid] || {}).name || "Brez dobavitelja")}</span><span class="xs muted num">${fmt(last)}${s.length > 1 ? ` · ${ch > 0 ? "▲" : ch < 0 ? "▼" : ""}${nf0.format(Math.abs(ch))} %` : ""}</span></span>`; }).join("");
  el.innerHTML = svg + `<div class="row" style="gap:6px 14px;margin-top:6px">${legend}</div>`;
}

  const saved = lsGet("email", "");
  box.innerHTML = `<form class="card" id="loginForm">${LOGO}<div><h1>Subri<span style="color:var(--brand)">loga</span></h1><p>Zaloga materiala ordinacije</p></div>
    <div class="field"><label for="lg_email">E-pošta</label><input type="email" id="lg_email" required autocomplete="username" value="${esc(saved)}"></div>
    <div class="field"><label for="lg_pass">Geslo</label><input type="password" id="lg_pass" required autocomplete="current-password" ${saved ? "autofocus" : ""}></div>
    <div class="err" id="lg_err">${msg ? esc(msg) : ""}</div>
    <button class="btn primary block" type="submit" id="lg_btn">Prijava</button>
    <button class="btn ghost block" type="button" id="lg_forgot">Pozabljeno geslo / prvič nastavi geslo</button>
    <button class="btn ghost block" type="button" data-act="demo-on">${ic("sparkle", 16)} Poglej vadnico brez prijave</button></form>`;
  $("#loginForm").onsubmit = async e => {
    e.preventDefault(); const email = fv("lg_email").toLowerCase(); $("#lg_err").textContent = ""; $("#lg_btn").disabled = true; lsSet("email", email);
    const {error} = await SB.auth.signInWithPassword({email, password: $("#lg_pass").value});
    $("#lg_btn").disabled = false;
    if (error) $("#lg_err").textContent = /invalid/i.test(error.message) ? "Napačna e-pošta ali geslo." : "Prijava ni uspela: " + error.message;
  };
  $("#lg_forgot").onclick = async () => {
    const email = fv("lg_email").toLowerCase();
    if (!email) { $("#lg_err").textContent = "Najprej vpiši svojo e-pošto."; return; }
    lsSet("email", email);
    const {error} = await SB.auth.resetPasswordForEmail(email, {redirectTo: location.href.split("#")[0]});
    $("#lg_err").style.color = error ? "" : "var(--ok)";
    $("#lg_err").textContent = error ? "Pošiljanje ni uspelo: " + error.message : "Poslali smo e-pošto s povezavo. Klikni jo in nastavi novo geslo.";
  };
}
function passwordSheet(first) {
  openSheet(`${sheetHead(first ? "Nastavi novo geslo" : "Spremeni geslo", "Vsaj 8 znakov. Brskalnik ali telefon si ga lahko zapomni.")}
    <form id="pwForm"><div class="fgrid">
      <div class="field full"><label for="pw1">Novo geslo</label><input type="password" id="pw1" autocomplete="new-password" minlength="8" required autofocus></div>
      <div class="field full"><label for="pw2">Ponovi geslo</label><input type="password" id="pw2" autocomplete="new-password" minlength="8" required></div>
    </div><div class="err small" id="pw_err" style="color:var(--crit);margin-top:8px"></div>
    <div class="btns"><button type="button" class="btn" data-act="close">Prekliči</button><button class="btn primary" type="submit">Shrani geslo</button></div></form>`);
  $("#pwForm").onsubmit = async e => {
    e.preventDefault(); const a = $("#pw1").value, b = $("#pw2").value;
    if (a.length < 8) return $("#pw_err").textContent = "Geslo mora imeti vsaj 8 znakov.";
    if (a !== b) return $("#pw_err").textContent = "Gesli se ne ujemata.";
    const {error} = await SB.auth.updateUser({password: a});
    if (error) return $("#pw_err").textContent = "Ni uspelo: " + error.message;
    closeSheet(); toast("Geslo shranjeno");
  };
}
let started = false;
async function start(session) {
  if (started) return; started = true;
  ME = session.user.email.toLowerCase();
  $("#login").hidden = false; $("#login").innerHTML = `<div class="loading">${LOGO.replace('class="logo-mark"', 'class="logo-mark" style="margin:0 auto 14px;width:56px;height:56px"')}Nalagam zalogo …</div>`;
  try { await loadAll(); }
  catch (e) { started = false; console.error(e); return showLogin("Podatkov ni bilo mogoče naložiti. Preveri, ali je tvoj e-naslov med člani."); }
  if (!names[ME]) { started = false; await SB.auth.signOut(); return showLogin("Prijava je uspela, a ta e-naslov ni v tabeli članov (members)."); }
  live = true; demo = false; D = null; render();
  const ch = SB.channel("subriloga");
  COLLS.concat(["members"]).forEach(t => ch.on("postgres_changes", {event: "*", schema: "public", table: t}, p => {
    if (demo) return;
    if (t === "members") { if (p.new && p.new.email) names[p.new.email] = p.new.name || p.new.email; return schedule(); }
    if (p.eventType === "DELETE") { if (p.old && p.old.id) applyLocal(t, {id: p.old.id}, true); }
    else applyLocal(t, fromRow(p.new));
  }));
  ch.subscribe();
  document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible" && live && !demo) { try { await loadAll(); schedule(); } catch (e) {} } });
}
(async function boot() {
  if (window.supabase && /^https:\/\//.test(SUPABASE_URL) && SUPABASE_KEY.length > 20) SB = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth: {persistSession: true, autoRefreshToken: true}});
  if (!SB) return showLogin();
  const recovering = /type=recovery/.test(location.hash);
  SB.auth.onAuthStateChange((ev, session) => {
    if (ev === "PASSWORD_RECOVERY") { const open = () => live ? passwordSheet(true) : setTimeout(open, 300); open(); }
    if (session && !started) start(session);
  });
  if (recovering) { const open = () => live ? (history.replaceState(null, "", location.pathname), passwordSheet(true)) : setTimeout(open, 300); setTimeout(open, 300); }
  const {data} = await SB.auth.getSession();
  if (data.session) start(data.session); else showLogin();
})();

/* ================= VADNICA (izmišljeni podatki) ================= */

  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const d = Object.fromEntries(COLLS.map(c => [c, []]));
  const sup = [["s1", "Dentalni center (primer)", 2, 150], ["s2", "MediDent (primer)", 4, 100], ["s3", "Zobni svet (primer)", 3, 200]];

    ["Sterilizacijske vrečke", "Dezinfekcija in sterilizacija", "kos", 200, 200, 800, 0.045, 18, "s3"],
    ["Dezinfekcija površin 1 l", "Dezinfekcija in sterilizacija", "steklenička", 1, 3, 10, 9.8, .25, "s2"],
    ["Polirna pasta", "Profilaksa", "tuba", 1, 2, 6, 7.9, .15, "s3"]
  ];
  const now = Date.now(); const iso = t => new Date(t).toISOString().slice(0, 10);
  const who = ["demo@primer.si", "asistentka@primer.si"]; names["demo@primer.si"] = "Klemen"; names["asistentka@primer.si"] = "Asistentka";
  items.forEach(([name, category, unit, packSize, minQty, targetQty, price, daily, sid], n) => {
    const id = "i" + n; d.items.push({id, name, category, unit, packSize, minQty, targetQty, supplierId: sid, location: ["Omara 1", "Omara 2", "Predal A", "Skladišče"][n % 4], code: "ART-" + (1040 + n * 7), gtin: "0401234567" + String(8900 + n)});
    for (let k = 0; k < 4; k++) { const drift = 1 + (k * 0.025) + (n % 3 === 0 ? k * 0.02 : 0); d.price_history.push({id: "ph" + n + "a" + k, itemId: id, supplierId: sid, unitPrice: +(price * drift * 0.94).toFixed(4), packSize, date: iso(now - (330 - k * 100) * DAY), source: "offer"}); if (n % 3 !== 2) d.price_history.push({id: "ph" + n + "b" + k, itemId: id, supplierId: sup[(n + 1) % 3][0], unitPrice: +(price * (0.98 + k * 0.01)).toFixed(4), packSize, date: iso(now - (300 - k * 95) * DAY), source: "offer"}); }
    d.offers.push({id: "o" + n + "a", itemId: id, supplierId: sid, price: +(price * packSize).toFixed(2), packSize, date: iso(now - (n % 5) * 30 * DAY), url: "https://www.primer.si/izdelek-" + n});

    let stock = 0;
    for (let w = 26; w >= 0; w--) {
      const t = now - w * 7 * DAY;
      if (w % 6 === 0 || stock < minQty) { const q = Math.ceil((targetQty - stock) / packSize) * packSize; if (q > 0) { stock += q; d.moves.push({id: "m" + n + "i" + w, itemId: id, type: "in", qty: q, unitPrice: price, date: iso(t - DAY), supplierId: sid, lot: "L" + (230 + w), byUser: who[0]}); } }
      const q = daily < 1 ? (rnd() < daily * 7 ? 1 : 0) : Math.round(daily * 7 * (0.7 + rnd() * 0.6));
      if (q > 0 && w > 0) { const take = Math.min(stock, q); stock -= take; if (take) d.moves.push({id: "m" + n + "o" + w, itemId: id, type: "out", qty: take, unitPrice: price, date: iso(t), byUser: who[w % 2]}); }
    }
    if (n === 0 || n === 5 || n === 11) stock = Math.round(minQty * 0.6);
    if (n === 7) d.moves.push({id: "m7w", itemId: id, type: "waste", qty: 40, unitPrice: price, date: iso(now - 20 * DAY), lot: "L220", byUser: who[0]});
    const a = Math.round(stock * 0.4), b = stock - a;
    const e1 = n === 1 ? iso(now + 25 * DAY) : n === 12 ? iso(now - 3 * DAY) : iso(now + (120 + n * 30) * DAY);
    if (a > 0) d.lots.push({id: "l" + n + "a", itemId: id, lot: "A" + (4410 + n), expiry: e1, qty: a, price, receivedAt: iso(now - 60 * DAY)});
    if (b > 0) d.lots.push({id: "l" + n + "b", itemId: id, lot: "B" + (5120 + n), expiry: iso(now + (400 + n * 20) * DAY), qty: b, price, receivedAt: iso(now - 10 * DAY)});
  });
  d.orders.push({id: "ord1", supplierId: "s3", status: "sent", sentAt: iso(now - 2 * DAY), createdAt: iso(now - 2 * DAY), lines: [{itemId: "i7", packs: 4, packSize: 100, packPrice: 3, code: ""}, {itemId: "i8", packs: 2, packSize: 500, packPrice: 4, code: ""}]});
  d.orders.push({id: "ord0", supplierId: "s1", status: "received", sentAt: iso(now - 30 * DAY), receivedAt: iso(now - 27 * DAY), createdAt: iso(now - 31 * DAY), lines: [{itemId: "i2", packs: 6, packSize: 1, packPrice: 38.5}]});
  d.settings.push({id: "main", clinic: "Zobna ordinacija (primer)", signature: "Klemen", address: "Primerna ulica 1, 1000 Ljubljana", phone: "01 123 45 67", warnDays: 60, safetyDays: 7, template: DEFAULT_TEMPLATE});
  return d;
}
