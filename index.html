<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zaloga">
<meta name="theme-color" content="#12696F">
<title>Zaloga ordinacije</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#EEF2F2; --surface:#FFFFFF; --surface-2:#F6F8F8; --line:#D9E1E2; --line-2:#E7EDEE;
  --ink:#14232A; --ink-2:#45565C; --muted:#6D7D82;
  --accent:#12696F; --accent-ink:#FFFFFF; --accent-soft:#DDEEEE; --accent-hover:#0D565B;
  --ok:#23704A; --ok-soft:#E0F0E6; --warn:#9A6212; --warn-soft:#FBEFD9; --crit:#B3342A; --crit-soft:#F9E1DE;
  --info:#355E91; --info-soft:#E2EAF5;
  --bar:#12696F; --bar-2:#8FB9BB;
  --shadow:0 1px 2px rgba(20,35,42,.06),0 8px 24px rgba(20,35,42,.08);
  --sans:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#0E1719; --surface:#152124; --surface-2:#1A2A2E; --line:#2A3C40; --line-2:#22343A;
  --ink:#E4ECED; --ink-2:#B3C2C5; --muted:#8397A0;
  --accent:#4FB3B0; --accent-ink:#06201F; --accent-soft:#183B3C; --accent-hover:#6CC7C3;
  --ok:#62C08E; --ok-soft:#173627; --warn:#E0A94F; --warn-soft:#3A2C14; --crit:#F0877B; --crit-soft:#3E1D1A;
  --info:#8DB3E6; --info-soft:#1C2B40;
  --bar:#4FB3B0; --bar-2:#2F6E6D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E1719; --surface:#152124; --surface-2:#1A2A2E; --line:#2A3C40; --line-2:#22343A;
  --ink:#E4ECED; --ink-2:#B3C2C5; --muted:#8397A0;
  --accent:#4FB3B0; --accent-ink:#06201F; --accent-soft:#183B3C; --accent-hover:#6CC7C3;
  --ok:#62C08E; --ok-soft:#173627; --warn:#E0A94F; --warn-soft:#3A2C14; --crit:#F0877B; --crit-soft:#3E1D1A;
  --info:#8DB3E6; --info-soft:#1C2B40;
  --bar:#4FB3B0; --bar-2:#2F6E6D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground)}
body{font-family:var(--sans);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-size:.93em}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:20px 12px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:18px}
.brand{padding:0 8px;display:flex;gap:10px;align-items:center}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12px}
.navlist{display:flex;flex-direction:column;gap:2px}
.navbtn{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--ink-2);text-align:left;font-weight:500}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.navbtn .cnt{margin-left:auto;font-size:11px;font-weight:600;background:var(--crit);color:#fff;border-radius:99px;padding:1px 7px}
.side-foot{margin-top:auto;padding:0 8px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:middle}
.dot.demo{background:var(--warn)}
main{padding-inline:28px;padding-block:24px 96px;max-width:1240px;width:100%}
.tabbar{display:none}

.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-size:24px;letter-spacing:-.02em;margin:0;font-weight:650;text-wrap:balance}
.pagehead p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);margin-bottom:16px;border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner b{color:var(--warn)}
.banner .btn{margin-left:auto}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:default}
button.kpi{cursor:pointer}
button.kpi:hover{border-color:var(--muted)}
.kpi .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.kpi .val{font-size:26px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12.5px;color:var(--ink-2)}
.kpi.crit .val{color:var(--crit)} .kpi.warn .val{color:var(--warn)}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;flex-wrap:wrap}
.panel-h h2{font-size:15px;margin:0;font-weight:600}
.panel-h .hint{color:var(--muted);font-size:12.5px}
.panel-b{padding:0 16px 16px}
.stack{display:flex;flex-direction:column;gap:16px}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
.name{font-weight:550}
.sub2{color:var(--muted);font-size:12.5px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:550;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.mute{background:var(--surface-2);color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2)}
.best{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:600}

.meter{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;min-width:60px;position:relative}
.meter i{display:block;height:100%;border-radius:3px;background:var(--ok)}
.meter.warn i{background:var(--warn)} .meter.crit i{background:var(--crit)}
.meter b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-2);opacity:.55}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1 1 220px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--ink-2);font-weight:500}
.field .help{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=email],input[type=url],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:90px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.toolbar select{width:auto}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;color:var(--ink-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.onboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:8px}
.onboard .step{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.onboard .step h3{margin:0;font-size:14px}
.onboard .step p{margin:0;color:var(--ink-2);font-size:13px}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* charts */
.chart{position:relative;padding:8px 0 0 44px}
.chart .plot{position:relative;height:180px;border-bottom:1px solid var(--line)}
.chart .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line-2)}
.chart .gl span{position:absolute;right:calc(100% + 8px);top:-8px;font-size:11px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.chart .bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:2px}
.chart .col{flex:1 1 0;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;cursor:default;border:0;background:none;padding:0 4px}
.chart .col i{display:block;flex:1 1 auto;max-width:38px;background:var(--bar);border-radius:4px 4px 0 0;min-height:1px}
.chart .col:hover i,.chart .col:focus-visible i{background:var(--accent-hover)}
.chart .col.cur i{background:var(--bar-2)}
.chart .xl{display:flex;gap:2px;margin-top:6px}
.chart .xl span{flex:1;text-align:center;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:10px;align-items:center}
.hb .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.hb .t{height:10px;background:var(--line-2);border-radius:0 4px 4px 0}
.hb .t i{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0}
.hb .v{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);text-align:right;min-width:72px}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);padding:6px 9px;border-radius:6px;font-size:12px;z-index:60;box-shadow:var(--shadow);white-space:nowrap}
.spark{display:flex;align-items:flex-end;gap:3px;height:42px}
.spark i{flex:1;background:var(--bar-2);border-radius:2px 2px 0 0;min-height:1px}
.spark i:last-child{background:var(--bar)}

/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,20,24,.45);display:flex;justify-content:flex-end}
#modal .sheet{background:var(--surface);width:min(640px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
#modal.center{justify-content:center;align-items:center;padding:16px}
#modal.center .sheet{height:auto;max-height:92vh;border-radius:14px;width:min(560px,100%)}
.sheet-h{position:sticky;top:0;background:var(--surface);z-index:2;display:flex;align-items:flex-start;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line-2)}
.sheet-h h2{margin:0;font-size:18px;letter-spacing:-.01em}
.sheet-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
.sheet-h .x{margin-left:auto}
.sheet-b{padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.sheet-f{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line-2);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:auto}
.sec-t{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:0 0 6px}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.dl div{background:var(--surface-2);border-radius:8px;padding:9px 11px}
.dl dt{font-size:11.5px;color:var(--muted)}
.dl dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums}
pre.mail{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--mono);font-size:12.5px;margin:0;user-select:text}
.confirm{background:var(--crit-soft);border-radius:8px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;z-index:70;box-shadow:var(--shadow);font-weight:500}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;border:0;border-radius:99px;background:var(--accent);color:var(--accent-ink);padding:13px 18px;font-weight:600;box-shadow:var(--shadow);cursor:pointer;display:flex;gap:8px;align-items:center}
.fab:hover{background:var(--accent-hover)}

.ordercard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.ordercard + .ordercard{margin-top:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.nowrap{white-space:nowrap}
.linkish{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-weight:500;text-align:left}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

@media (max-width:900px){
  .grid2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding-inline:16px;padding-block:16px 150px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));overflow-x:auto}
  .tabbar button{flex:1 0 auto;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 8px;color:var(--muted);border-radius:8px;position:relative;font-weight:500}
  .tabbar button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
  .tabbar .cnt{position:absolute;top:2px;right:6px;background:var(--crit);color:#fff;border-radius:99px;font-size:10px;padding:0 5px}
  .fab{bottom:calc(76px + env(safe-area-inset-bottom,0px));right:16px}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .pagehead h1{font-size:21px}
  .hide-sm{display:none}
  .kpi .val{font-size:22px}
  .hb{grid-template-columns:minmax(0,1fr) auto;}
  .hb .t{grid-column:1/-1;grid-row:2}
}
@media (prefers-reduced-motion:no-preference){
  #modal .sheet{animation:slide .18s ease-out}
  #modal.center .sheet{animation:pop .15s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:.6}}
  @keyframes pop{from{transform:scale(.98);opacity:.6}}
}

.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;width:min(400px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.login h1{margin:0;font-size:22px;letter-spacing:-.02em}
.login p{margin:0;color:var(--ink-2)}
.login .err{color:var(--crit);font-size:13px}
body{margin:0}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
</head>
<body>
<div id="login" class="login" hidden></div>
<div class="app" id="app">
  <aside class="side" aria-label="Glavna navigacija">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3c-2.5 0-4 2-4 4.5 0 3 1.5 4.5 2 7 .5 2.6 1 6.5 2.8 6.5 1.6 0 1.7-4 2.2-5.5.3-.9.9-1.2 2-1.2s1.7.3 2 1.2c.5 1.5.6 5.5 2.2 5.5 1.8 0 2.3-3.9 2.8-6.5.5-2.5 2-4 2-7C21 5 19.5 3 17 3c-2 0-3 1-5 1S9 3 7 3z"/></svg></div>
      <div><b>Zaloga</b><small id="clinicName">Ordinacija</small></div>
    </div>
    <nav class="navlist" id="nav"></nav>
    <div class="side-foot" id="sidefoot"></div>
  </aside>
  <main id="main"><div class="loading">Nalagam podatke …</div></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Navigacija"></nav>
<button class="fab" id="fab" type="button" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>Porabi material</button>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<div id="tip" hidden></div>

<script>
"use strict";
/* ================= NASTAVITVE POVEZAVE =================
   Supabase → Project Settings → API (ali »Connect«):
   SUPABASE_URL = Project URL, SUPABASE_KEY = Publishable key (sb_publishable_…). NIKOLI secret key!
   Ključ je javen in varen za objavo — podatke ščitijo pravila RLS v bazi. */
const SUPABASE_URL = "https://ferznatebgzlqwxenxgh.supabase.co";
const SUPABASE_KEY = "sb_publishable_NoChIjIp2Ezkb-bS3g8NEQ_0xqm0j0y";
/* ======================================================== */
/* ---------------- utilities ---------------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const nf = new Intl.NumberFormat("sl-SI", {maximumFractionDigits: 2});
const nf0 = new Intl.NumberFormat("sl-SI", {maximumFractionDigits: 0});
const eur = new Intl.NumberFormat("sl-SI", {style: "currency", currency: "EUR"});
const eur0 = new Intl.NumberFormat("sl-SI", {style: "currency", currency: "EUR", maximumFractionDigits: 0});
const num = v => { if (v === "" || v == null) return 0; const n = typeof v === "number" ? v : parseFloat(String(v).replace(/\s/g, "").replace(",", ".")); return isFinite(n) ? n : 0; };
const DAY = 864e5;

// Aplikacija uporablja camelCase (itemId), baza snake_case (item_id).
const snake = k => k.replace(/[A-Z]/g, c => "_" + c.toLowerCase());
const camel = k => k.replace(/_([a-z])/g, (m, c) => c.toUpperCase());
const toRow = o => { const r = {}; Object.entries(o).forEach(([k, v]) => { if (v !== undefined) r[snake(k)] = v; }); return r; };
const fromRow = r => { const o = {}; Object.entries(r).forEach(([k, v]) => o[camel(k)] = v); return o; };
function applyLocal(coll, rec, remove) {
  const arr = S()[coll]; const i = arr.findIndex(x => x.id === rec.id);
  if (remove) { if (i >= 0) arr.splice(i, 1); }
  else if (i >= 0) arr[i] = Object.assign({}, arr[i], rec); else arr.push(rec);
  schedule();
}
function check(res) { if (res.error) { const e = new Error(res.error.message); e.code = res.error.code === "42501" ? "denied" : "db"; e.detail = res.error; throw e; } return res; }
async function put(coll, id, data) {
  const body = clean(Object.assign({}, data, {id}));
  if (demo) return applyLocal(coll, body);
  check(await SB.from(coll).upsert(toRow(body)));
  applyLocal(coll, body);
}
async function patch(coll, id, data) {
  const body = clean(data);
  if (demo) return applyLocal(coll, Object.assign({id}, body));
  check(await SB.from(coll).update(toRow(body)).eq("id", id));
  applyLocal(coll, Object.assign({id}, body));
}
async function del(coll, id) {

}
async function safe(fn, okMsg) {

  catch (e) {

    console.error(e); return false;

}
async function fetchAll(table) {
  const out = []; const step = 1000;
  for (let from = 0; ; from += step) {
    const res = check(await SB.from(table).select("*").order("id").range(from, from + step - 1));
    out.push(...res.data.map(fromRow));
    if (res.data.length < step) break;
  }
  return out;
}
async function loadAll() {

let M = null;
function derive() {
  const s = S(), st = settings();
  const byId = {}; s.items.forEach(i => byId[i.id] = i);
  const sup = {}; s.suppliers.forEach(x => sup[x.id] = x);
  const now = Date.now();
  const res = {byId, sup, it: {}};
  const onOrder = {};
  s.orders.filter(o => o.status === "sent").forEach(o => (o.lines || []).forEach(l => { onOrder[l.itemId] = (onOrder[l.itemId] || 0) + num(l.packs) * (num(l.packSize) || 1); }));
  const lastIn = {};
  const out90 = {}; let firstMove = now;
  s.moves.forEach(m => {
    const t = new Date(m.date).getTime(); if (t < firstMove) firstMove = t;
    if (m.type === "in" && num(m.unitPrice) > 0) { if (!lastIn[m.itemId] || lastIn[m.itemId].date < m.date) lastIn[m.itemId] = m; }
    if (m.type === "out" && now - t <= 90 * DAY) out90[m.itemId] = (out90[m.itemId] || 0) + num(m.qty);
  });
  const spanDays = Math.max(14, Math.min(90, (now - firstMove) / DAY));
  const offersBy = {}; s.offers.forEach(o => { (offersBy[o.itemId] = offersBy[o.itemId] || []).push(Object.assign({}, o, {unit: num(o.price) / (num(o.packSize) || 1)})); });
  Object.values(offersBy).forEach(a => a.sort((a, b) => a.unit - b.unit));
  const lotsBy = {}; s.lots.forEach(l => { if (num(l.qty) > 0) (lotsBy[l.itemId] = lotsBy[l.itemId] || []).push(l); });
  const fefo = (a, b) => (a.expiry || "9999") < (b.expiry || "9999") ? -1 : (a.expiry || "9999") > (b.expiry || "9999") ? 1 : (a.receivedAt || "") < (b.receivedAt || "") ? -1 : 1;
  let totalValue = 0;
  s.items.forEach(item => {
    const lots = (lotsBy[item.id] || []).sort(fefo);
    const stock = lots.reduce((a, l) => a + num(l.qty), 0);
    const offers = offersBy[item.id] || [];
    const best = offers[0] || null;
    const unitCost = lastIn[item.id] ? num(lastIn[item.id].unitPrice) : best ? best.unit : num(item.price);
    const value = lots.reduce((a, l) => a + num(l.qty) * (num(l.price) || unitCost), 0);
    totalValue += value;
    const daily = (out90[item.id] || 0) / spanDays;
    const daysLeft = daily > 0 ? stock / daily : Infinity;
    const min = num(item.minQty), target = num(item.targetQty) || Math.max(min * 2, 1);
    const prefSup = sup[item.supplierId] || (best && sup[best.supplierId]) || null;
    const lead = num(prefSup && prefSup.deliveryDays) || 3;
    const oo = onOrder[item.id] || 0;
    const expLots = lots.filter(l => l.expiry && daysUntil(l.expiry) <= st.warnDays);
    const expired = lots.filter(l => l.expiry && daysUntil(l.expiry) < 0);
    let status = "ok", label = "V redu";
    const proj = stock + oo;
    if (stock <= 0 && oo <= 0) { status = "crit"; label = "Ni zaloge"; }
    else if (proj <= min && min > 0) { status = "crit"; label = "Naroči"; }
    else if (daily > 0 && proj / daily < lead + num(st.safetyDays)) { status = "warn"; label = "Kmalu naroči"; }
    else if (oo > 0 && stock <= min) { status = "info"; label = "Naročeno"; }
    else if (min === 0 && !daily) { status = "mute"; label = "Brez minimuma"; }
    if (oo > 0 && status !== "crit" && status !== "warn") { status = "info"; label = "Naročeno"; }
    const need = (status === "crit" || status === "warn") ? Math.max(0, target - proj) : 0;
    const ps = num(best ? best.packSize : item.packSize) || num(item.packSize) || 1;
    const packs = need > 0 ? Math.ceil(need / ps) : 0;
    res.it[item.id] = {item, lots, stock, value, unitCost, daily, monthly: daily * 30, daysLeft, min, target, status, label, onOrder: oo, need, packs, packSize: ps, best, offers, supplier: prefSup, orderSupplier: (best && sup[best.supplierId]) || prefSup, expLots, expired};
  });
  res.totalValue = totalValue;
  res.list = Object.values(res.it);
  res.reorder = res.list.filter(x => x.status === "crit" || x.status === "warn");
  res.expiring = [];
  res.list.forEach(x => x.expLots.forEach(l => res.expiring.push({x, l, d: daysUntil(l.expiry)})));
  res.expiring.sort((a, b) => a.d - b.d);
  return res;
}

function monthly() {
  // returns {monthKey: {out:{itemId:{q,v}}, in:{itemId:{q,v}}, waste:{itemId:{q,v}}, sup:{sid:v}}}
  const s = S(), agg = {};
  const g = k => agg[k] = agg[k] || {out: {}, in: {}, waste: {}, sup: {}};
  const add = (o, id, q, v) => { o[id] = o[id] || {q: 0, v: 0}; o[id].q += q; o[id].v += v; };
  s.moves.forEach(m => {
    const k = monthKey(m.date), a = g(k), q = Math.abs(num(m.qty)), v = q * num(m.unitPrice);
    if (m.type === "out") add(a.out, m.itemId, q, v);
    else if (m.type === "waste") add(a.waste, m.itemId, q, v);
    else if (m.type === "in") { add(a.in, m.itemId, q, v); if (m.supplierId) a.sup[m.supplierId] = (a.sup[m.supplierId] || 0) + v; }
  });
  s.archive.forEach(ar => {
    const a = g(ar.month);
    Object.entries(ar.items || {}).forEach(([id, r]) => { add(a.out, id, num(r.out), num(r.outVal)); add(a.in, id, num(r.in), num(r.inVal)); add(a.waste, id, num(r.waste), num(r.wasteVal)); });
    Object.entries(ar.bySupplier || {}).forEach(([sid, v]) => a.sup[sid] = (a.sup[sid] || 0) + num(v));
  });
  return agg;
}

function stockTable() {
  const q = ui.q.toLowerCase().trim();
  let list = M.list.filter(x => {
    const i = x.item;
    if (q && ![i.name, i.code, i.location, i.category].some(v => String(v || "").toLowerCase().includes(q))) return false;
    if (ui.cat && i.category !== ui.cat) return false;
    if (ui.status === "order" && !(x.status === "crit" || x.status === "warn")) return false;
    if (ui.status === "exp" && !x.expLots.length) return false;
    if (ui.status === "ok" && (x.status === "crit" || x.status === "warn")) return false;
    return true;
  });
  const rank = {crit: 0, warn: 1, info: 2, ok: 3, mute: 4};
  list.sort((a, b) => rank[a.status] - rank[b.status] || a.item.name.localeCompare(b.item.name, "sl"));
  if (!list.length) return `<div class="empty"><b>${M.list.length ? "Ni zadetkov" : "Seznam je prazen"}</b>${M.list.length ? "Spremenite iskanje ali filter." : "Dodajte prvi material."}</div>`;
  return `<table><thead><tr><th>Material</th><th class="hide-sm">Kategorija</th><th class="r">Zaloga</th><th class="hide-sm" style="width:110px">Min / cilj</th><th class="r hide-sm">Poraba / mes</th><th class="r hide-sm">Dovolj za</th><th class="hide-sm">Najbližji rok</th><th>Stanje</th><th class="r"></th></tr></thead><tbody>${list.map(x => {
    const i = x.item, nl = x.lots.find(l => l.expiry), d = nl ? daysUntil(nl.expiry) : null;
    return `<tr class="click" data-item="${i.id}"><td><div class="name">${esc(i.name)}</div><div class="sub2">${[i.code && `<span class="mono">${esc(i.code)}</span>`, i.location && esc(i.location)].filter(Boolean).join(" · ") || "&nbsp;"}</div></td>
      <td class="hide-sm"><span class="tag">${esc(i.category || "—")}</span></td>
      <td class="r nowrap">${qty(x.stock, i.unit)}${x.onOrder ? `<div class="sub2">+${nf.format(x.onOrder)} naročeno</div>` : ""}</td>
      <td class="hide-sm">${meter(x)}<div class="sub2 num">${nf.format(x.min)} / ${nf.format(x.target)}</div></td>
      <td class="r num hide-sm">${x.monthly ? nf.format(Math.round(x.monthly * 10) / 10) : "—"}</td>

  }).join("")}</tbody></table>`;
}

/* ---------------- VIEW: Naročila ---------------- */
function orderTotal(o) { return (o.lines || []).reduce((a, l) => a + num(l.packs) * num(l.packPrice), 0); }
function vNarocila() {
  const s = S();

  const drafts = s.orders.filter(o => o.status === "draft"), sent = s.orders.filter(o => o.status === "sent");
  const done = s.orders.filter(o => o.status === "received").sort((a, b) => (b.receivedAt || "").localeCompare(a.receivedAt || "")).slice(0, 10);

      <div class="tablewrap"><table><thead><tr><th>Material</th><th class="r">Zaloga</th><th class="r">Min / cilj</th><th class="r">Predlog</th><th class="r hide-sm">Cena pak.</th><th></th></tr></thead><tbody>${arr.map(x => `<tr><td><button class="linkish" data-item="${x.item.id}">${esc(x.item.name)}</button></td><td class="r num">${nf.format(x.stock)}</td><td class="r num">${nf.format(x.min)} / ${nf.format(x.target)}</td><td class="r nowrap"><b class="num">${x.packs}</b> <span class="muted small">× ${nf.format(x.packSize)} ${esc(x.item.unit)}</span></td><td class="r num hide-sm">${x.best ? eur.format(num(x.best.price)) : x.unitCost ? eur.format(x.unitCost * x.packSize) : "—"}</td><td>${pill(x)}</td></tr>`).join("")}</tbody></table></div></div>`;
    }).join("") : `<div class="empty"><b>Trenutno ni treba naročiti ničesar</b>Vsi artikli so nad minimumom in zadoščajo za rok dostave.</div>`}</div></section>
  ${drafts.length ? `<section class="panel"><div class="panel-h"><h2>Osnutki</h2><span class="hint">preglej, kopiraj e-pošto, označi kot poslano</span></div><div class="panel-b">${drafts.map(orderRow).join("")}</div></section>` : ""}
  <section class="panel"><div class="panel-h"><h2>Poslana – čakajo na dostavo</h2></div><div class="panel-b">${sent.length ? sent.map(orderRow).join("") : `<div class="empty">Ni odprtih naročil.</div>`}</div></section>
  <section class="panel"><div class="panel-h"><h2>Prevzeta naročila</h2><span class="hint">zadnjih 10</span></div><div class="panel-b">${done.length ? done.map(orderRow).join("") : `<div class="empty">Še ni prevzetih naročil.</div>`}</div></section>
  </div>`;

function orderRow(o) {

}

}

/* ---------------- VIEW: Statistika ---------------- */
function vStatistika() {
  const n = ui.statsRange, months = lastMonths(n), agg = monthly(), cur = monthKey(today());
  const out = months.map(k => ({k, v: sumV((agg[k] || {}).out)}));
  const inn = months.map(k => ({k, v: sumV((agg[k] || {}).in)}));
  const tot = {out: 0, in: 0, waste: 0}; const byItem = {}, byCat = {}, bySup = {};
  months.forEach(k => { const a = agg[k]; if (!a) return;
    Object.entries(a.out).forEach(([id, r]) => { tot.out += r.v; byItem[id] = byItem[id] || {q: 0, v: 0, w: 0}; byItem[id].q += r.q; byItem[id].v += r.v; const c = (M.byId[id] || {}).category || "Drugo"; byCat[c] = (byCat[c] || 0) + r.v; });
    Object.values(a.in).forEach(r => tot.in += r.v);
    Object.entries(a.waste).forEach(([id, r]) => { tot.waste += r.v; byItem[id] = byItem[id] || {q: 0, v: 0, w: 0}; byItem[id].w += r.v; });
    Object.entries(a.sup).forEach(([sid, v]) => bySup[sid] = (bySup[sid] || 0) + v);
  });
  const full = months.filter(k => k !== cur); const avg = full.length ? full.reduce((a, k) => a + sumV((agg[k] || {}).out), 0) / full.length : tot.out;
  const top = Object.entries(byItem).filter(([id]) => M.byId[id]).sort((a, b) => b[1].v - a[1].v);
  const fm = months.filter(k => k !== cur), half = Math.floor(fm.length / 2), m1 = fm.slice(0, half), m2 = fm.slice(half);
  const trend = id => { const a = m1.reduce((s, k) => s + (((agg[k] || {}).out || {})[id] || {q: 0}).q, 0) / (m1.length || 1), b = m2.reduce((s, k) => s + (((agg[k] || {}).out || {})[id] || {q: 0}).q, 0) / (m2.length || 1); if (!a && !b) return "—"; if (!a) return '<span class="pill info">novo</span>'; const p = (b / a - 1) * 100; return `<span class="num" style="color:${p > 15 ? "var(--warn)" : p < -15 ? "var(--ok)" : "var(--ink-2)"}">${p > 0 ? "▲" : p < 0 ? "▼" : ""} ${nf0.format(Math.abs(p))} %</span>`; };
  const hb = (arr, fmt) => { const mx = Math.max(...arr.map(a => a[1]), 1); return `<div class="hbars">${arr.map(([l, v]) => `<div class="hb"><span class="l" title="${esc(l)}">${esc(l)}</span><span class="t"><i style="width:${v / mx * 100}%"></i></span><span class="v">${fmt(v)}</span></div>`).join("")}</div>`; };
  return `<div class="pagehead"><div><h1>Statistika porabe</h1><p>Vrednost porabe je izračunana po nabavni ceni serije (LOT), iz katere je bil material porabljen.</p></div>
    <div class="actions"><div class="seg" role="group" aria-label="Obdobje">${[3, 6, 12].map(r => `<button data-range="${r}" aria-pressed="${n === r}">${r} mes</button>`).join("")}</div><button class="btn" data-act="export-usage">Izvozi CSV</button></div></div>
  <div class="kpis">
    <div class="kpi"><span class="lbl">Poraba v obdobju</span><span class="val">${eur0.format(tot.out)}</span><span class="sub">zadnjih ${n} mesecev</span></div>
    <div class="kpi"><span class="lbl">Povprečno na mesec</span><span class="val">${eur0.format(avg)}</span><span class="sub">zaključeni meseci</span></div>
    <div class="kpi"><span class="lbl">Nabava v obdobju</span><span class="val">${eur0.format(tot.in)}</span><span class="sub">prevzet material</span></div>
    <div class="kpi ${tot.waste ? "warn" : ""}"><span class="lbl">Odpis</span><span class="val">${eur0.format(tot.waste)}</span><span class="sub">${tot.out ? nf.format(tot.waste / (tot.out + tot.waste) * 100) + " % porabe" : "potekel ali poškodovan"}</span></div>
  </div>
  <div class="grid2">
    <section class="panel"><div class="panel-h"><h2>Vrednost porabe po mesecih</h2><span class="hint">tekoči mesec svetlejše</span></div><div class="panel-b">${barChart(out, cur)}</div></section>
    <section class="panel"><div class="panel-h"><h2>Stroški nabave po mesecih</h2></div><div class="panel-b">${barChart(inn, cur)}</div></section>
    <section class="panel"><div class="panel-h"><h2>Poraba po kategorijah</h2></div><div class="panel-b">${Object.keys(byCat).length ? hb(Object.entries(byCat).sort((a, b) => b[1] - a[1]), v => eur0.format(v)) : '<div class="empty">Ni podatkov.</div>'}</div></section>
    <section class="panel"><div class="panel-h"><h2>Nabava po dobaviteljih</h2></div><div class="panel-b">${Object.keys(bySup).length ? hb(Object.entries(bySup).map(([s, v]) => [(M.sup[s] || {}).name || "Neznan", v]).sort((a, b) => b[1] - a[1]), v => eur0.format(v)) : '<div class="empty">Ni podatkov.</div>'}</div></section>
    <section class="panel" style="grid-column:1/-1"><div class="panel-h"><h2>Poraba po materialu</h2><span class="hint">trend: druga polovica obdobja proti prvi</span></div>
      <div class="tablewrap">${top.length ? `<table><thead><tr><th>Material</th><th class="r">Porabljeno</th><th class="r">Na mesec</th><th class="r">Vrednost</th><th class="r hide-sm">Delež</th><th class="r hide-sm">Odpis</th><th class="r">Trend</th></tr></thead><tbody>${top.map(([id, r]) => { const it = M.byId[id]; return `<tr class="click" data-item="${id}"><td class="name">${esc(it.name)}</td><td class="r nowrap">${qty(r.q, it.unit)}</td><td class="r num">${nf.format(Math.round(r.q / n * 10) / 10)}</td><td class="r num">${eur.format(r.v)}</td><td class="r num hide-sm">${tot.out ? nf.format(r.v / tot.out * 100) : 0} %</td><td class="r num hide-sm">${r.w ? eur.format(r.w) : "—"}</td><td class="r">${trend(id)}</td></tr>`; }).join("")}</tbody></table>` : '<div class="empty">V izbranem obdobju ni zabeležene porabe.</div>'}</div></section>
  </div>`;
}
function niceMax(v) { if (v <= 0) return 100; const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function barChart(data, cur) {
  const mx = niceMax(Math.max(...data.map(d => d.v))); const ticks = [0, .25, .5, .75, 1];
  return `<div class="chart"><div class="plot">${ticks.map(t => `<div class="gl" style="bottom:${t * 100}%"><span>${eur0.format(mx * t)}</span></div>`).join("")}
    <div class="bars">${data.map(d => `<button class="col ${d.k === cur ? "cur" : ""}" data-tip="${esc(monthLabel(d.k))}: ${esc(eur.format(d.v))}" aria-label="${esc(monthLabel(d.k))}: ${esc(eur.format(d.v))}"><i style="height:${d.v / mx * 100}%"></i></button>`).join("")}</div></div>
    <div class="xl">${data.map(d => `<span>${monthLabel(d.k).split(" ")[0]}</span>`).join("")}</div></div>`;
}

/* ---------------- VIEW: Dobavitelji ---------------- */

/* ---------------- modal system ---------------- */
function openModal(html, center = false) { const m = $("#modal"); m.className = center ? "center" : ""; m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; m.hidden = false; const f = m.querySelector("[autofocus]") || m.querySelector("input,select,textarea,button"); if (f) setTimeout(() => f.focus(), 30); }
function closeModal() { const m = $("#modal"); m.hidden = true; m.innerHTML = ""; }
const head = (t, sub) => `<div class="sheet-h"><div><h2>${t}</h2>${sub ? `<p>${sub}</p>` : ""}</div><button class="btn ghost sm x" data-act="close" aria-label="Zapri">✕</button></div>`;
let toastT; function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
const itemOptions = (sel, filter) => S().items.slice().sort((a, b) => a.name.localeCompare(b.name, "sl")).filter(filter || (() => true)).map(i => `<option value="${i.id}" ${i.id === sel ? "selected" : ""}>${esc(i.name)}</option>`).join("");
const supOptions = sel => `<option value="">— izberi —</option>` + S().suppliers.slice().sort((a, b) => a.name.localeCompare(b.name, "sl")).map(s => `<option value="${s.id}" ${s.id === sel ? "selected" : ""}>${esc(s.name)}</option>`).join("");
const fv = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };

/* stock operations */
async function addStock({itemId, qty, lot, expiry, price, supplierId, note, orderId, initial, date}) {
  const lotId = uid(), d = date || today();
  await safe(async () => {
    await put("lots", lotId, {itemId, lot: lot || "", expiry: expiry || "", qty, price: price || 0, receivedAt: d, supplierId: supplierId || ""});
    if (!initial) await put("moves", uid(), {itemId, type: "in", qty, unitPrice: price || 0, lot: lot || "", expiry: expiry || "", supplierId: supplierId || "", date: d, ts: new Date().toISOString(), byUser: ME || "", note: note || "", orderId: orderId || ""});
  });
}
async function takeStock(itemId, qty, type, note, specificLotId) {
  const x = M.it[itemId]; let left = qty; const touched = [];
  const lots = specificLotId ? x.lots.filter(l => l.id === specificLotId) : x.lots;
  for (const l of lots) { if (left <= 0) break; const t = Math.min(num(l.qty), left); left -= t; touched.push({l, t}); }
  const taken = qty - left; if (taken <= 0) { toast("Ni zaloge za porabo."); return false; }
  const value = touched.reduce((a, r) => a + r.t * (num(r.l.price) || x.unitCost), 0);
  return safe(async () => {
    for (const r of touched) { const rest = num(r.l.qty) - r.t; if (rest <= 1e-9) await del("lots", r.l.id); else await patch("lots", r.l.id, {qty: Math.round(rest * 1000) / 1000}); }
    await put("moves", uid(), {itemId, type, qty: taken, unitPrice: Math.round(value / taken * 10000) / 10000, lot: touched.map(r => r.l.lot).filter(Boolean).join(", "), date: today(), ts: new Date().toISOString(), byUser: ME || "", note: note || ""});
  }, left > 0 ? `Zabeleženo ${nf.format(taken)} (več ni bilo na zalogi)` : null);
}

/* CSV export */
async function exportCsv(kind) {
  const rows = [];
  if (kind === "stock") {
    rows.push(["Naziv", "Kategorija", "Šifra", "Lokacija", "Enota", "Zaloga", "Minimum", "Cilj", "Poraba na mesec", "Cena na enoto", "Vrednost", "Stanje", "LOT", "Rok uporabe", "Količina v seriji"]);
    M.list.forEach(x => { const base = [x.item.name, x.item.category, x.item.code, x.item.location, x.item.unit, x.stock, x.min, x.target, Math.round(x.monthly * 10) / 10, x.unitCost.toFixed(2), x.value.toFixed(2), x.label]; if (!x.lots.length) rows.push(base.concat(["", "", ""])); x.lots.forEach(l => rows.push(base.concat([l.lot, l.expiry, l.qty]))); });
  } else {
    rows.push(["Datum", "Material", "Vrsta", "Količina", "Enota", "Cena na enoto", "Vrednost", "LOT", "Opomba"]);
    S().moves.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(m => { const it = M.byId[m.itemId] || {}; rows.push([m.date, it.name || "?", (MT[m.type] || [m.type])[0], m.qty, it.unit || "", num(m.unitPrice).toFixed(4), (Math.abs(num(m.qty)) * num(m.unitPrice)).toFixed(2), m.lot, m.note]); });
  }
  const csv = "﻿" + rows.map(r => r.map(v => { v = String(v ?? "").replace(/\./g, (s, i, str) => /^-?\d+\.\d+$/.test(str) ? "," : s); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(";")).join("\r\n");
  saveFile((kind === "stock" ? "zaloga-" : "gibanja-") + today() + ".csv", new Blob([csv], {type: "text/csv;charset=utf-8"}));
}

function saveFile(name, blob) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
function backup() { const data = {app: "zaloga-ordinacije", version: 1, exportedAt: new Date().toISOString(), tables: {}}; COLLS.forEach(c => data.tables[c] = S()[c]); saveFile("zaloga-kopija-" + today() + ".json", new Blob([JSON.stringify(data, null, 1)], {type: "application/json"})); }
let restoreData = null;
function restorePrep(file) {
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d.tables) throw 0; restoreData = d;
    const n = Object.values(d.tables).reduce((a, t) => a + (t || []).length, 0);
    $("#restoreZone").innerHTML = `<div class="confirm"><span>Kopija z dne ${fmtDate(d.exportedAt)} vsebuje ${n} zapisov. Obnovim?</span><button class="btn sm danger" data-act="restore-go">Da, obnovi</button></div>`;
  } catch (e) { toast("To ni veljavna varnostna kopija."); } };
  r.readAsText(file);
}
async function restoreGo() {
  if (!restoreData) return; let n = 0;
  for (const c of COLLS) { const rows = (restoreData.tables[c] || []).map(r => toRow(clean(r)));
    for (let i = 0; i < rows.length; i += 500) { if (demo) { rows.slice(i, i + 500).forEach(r => applyLocal(c, fromRow(r))); } else if (!await safe(async () => check(await SB.from(c).upsert(rows.slice(i, i + 500))))) return; n += rows.slice(i, i + 500).length; } }
  restoreData = null; if (!demo) { await loadAll(); schedule(); } toast(`Obnovljenih ${n} zapisov`);
}

/* ---------------- events ---------------- */
document.addEventListener("click", async e => {
  const go = e.target.closest("[data-go]");
  if (go) { view = go.dataset.go; if (go.dataset.status) ui.status = go.dataset.status; try { localStorage.setItem("zaloga.view", view); } catch (er) {} closeModal(); render(); window.scrollTo(0, 0); return; }
  const rg = e.target.closest("[data-range]"); if (rg) { ui.statsRange = +rg.dataset.range; render(); return; }
  const a = e.target.closest("[data-act]");
  if (a) {
    const id = a.dataset.id, act = a.dataset.act;
    switch (act) {
      case "close": closeModal(); break;
      case "consume": consumeForm(id); break;
      case "receive": receiveForm(id); break;
      case "item-new": itemForm.added = 0; itemForm(); break;
      case "item-edit": itemForm(id); break;
      case "item-del-ask": $("#delZone").innerHTML = `<div class="confirm"><span>Izbrišem material, njegove serije in ponudbe? Gibanja ostanejo v statistiki.</span><button type="button" class="btn sm danger" data-act="item-del" data-id="${id}">Da, izbriši</button></div>`; break;
      case "item-del": { const s = S(); for (const l of s.lots.filter(l => l.itemId === id)) await safe(() => del("lots", l.id)); for (const o of s.offers.filter(o => o.itemId === id)) await safe(() => del("offers", o.id)); await safe(() => del("items", id), "Material izbrisan"); closeModal(); break; }
      case "waste": wasteForm(id); break;
      case "count": countForm(); break;
      case "supplier": supplierForm(id); break;
      case "sup-del-ask": $("#delZone").innerHTML = `<div class="confirm"><span>Izbrišem dobavitelja in njegove ponudbe?</span><button type="button" class="btn sm danger" data-act="sup-del" data-id="${id}">Da, izbriši</button></div>`; break;
      case "sup-del": for (const o of S().offers.filter(o => o.supplierId === id)) await safe(() => del("offers", o.id)); await safe(() => del("suppliers", id), "Dobavitelj izbrisan"); closeModal(); break;
      case "offer-new": offerForm(null, id); break;
      case "offer-edit": offerForm(id); break;
      case "offer-del": await safe(() => del("offers", id), "Ponudba izbrisana"); closeModal(); break;
      case "order-new": { const oid = uid(); if (await safe(() => put("orders", oid, {supplierId: "", status: "draft", lines: [], createdAt: today()}))) { M = derive(); orderOpen(oid); } break; }
      case "draft-from": draftFrom(a.dataset.sid); break;
      case "order-open": orderOpen(id); break;
      case "order-save": { const o = S().orders.find(z => z.id === id); const sup = fv("od_sup"); await safe(() => patch("orders", id, {lines: readLines(o).filter(l => l.packs > 0), supplierId: sup}), "Osnutek shranjen"); M = derive(); orderOpen(id); break; }
      case "order-sent": { const o = S().orders.find(z => z.id === id); const sup = fv("od_sup"); if (!sup) return toast("Izberite dobavitelja."); await safe(() => patch("orders", id, {lines: readLines(o).filter(l => l.packs > 0), supplierId: sup, status: "sent", sentAt: today()}), "Označeno kot poslano"); closeModal(); break; }
      case "order-back": await safe(() => patch("orders", id, {status: "draft"})); M = derive(); orderOpen(id); break;
      case "order-recv": {
        const o = S().orders.find(z => z.id === id); const lines = readLines(o);
        for (let k = 0; k < lines.length; k++) { const l = lines[k]; const units = num(l.packs) * (num(l.packSize) || 1); if (units <= 0) continue;
          await addStock({itemId: l.itemId, qty: units, lot: fv("ol_l" + k), expiry: fv("ol_e" + k), price: num(l.packPrice) / (num(l.packSize) || 1), supplierId: o.supplierId, orderId: id}); }
        await safe(() => patch("orders", id, {lines, status: "received", receivedAt: today()}), "Naročilo prevzeto na zalogo"); closeModal(); break; }
      case "order-del-ask": $("#delZone").innerHTML = `<div class="confirm"><span>Izbrišem to naročilo?</span><button type="button" class="btn sm danger" data-act="order-del" data-id="${id}">Da, izbriši</button></div>`; break;
      case "order-del": await safe(() => del("orders", id), "Naročilo izbrisano"); closeModal(); break;
      case "line-del": { const o = S().orders.find(z => z.id === id); const lines = readLines(o); lines.splice(+a.dataset.k, 1); await safe(() => patch("orders", id, {lines})); M = derive(); orderOpen(id); break; }
      case "copy-mail": { const o = S().orders.find(z => z.id === id); const mt = mailText(o); copyText("Zadeva: " + mt.subject + "\n\n" + mt.body); break; }
      case "copy-cols": copyText(IMPORT_COLS.join("\t")); break;
      case "import": importForm(); break;
      case "history": ui.histItem = ""; historyForm(); break;
      case "backup": backup(); break;
      case "restore-go": a.disabled = true; await restoreGo(); break;
      case "logout": await SB.auth.signOut(); location.reload(); break;
      case "export-stock": exportCsv("stock"); break;
      case "export-usage": exportCsv("usage"); break;
      case "tpl-reset": $("#s_tpl").value = DEFAULT_TEMPLATE; break;
      case "demo-on": D = makeDemo(); demo = true; view = "pregled"; render(); break;
      case "demo-off": demo = false; D = null; if (live) render(); else showLogin(); break;
    }
    return;
  }
  const it = e.target.closest("[data-item]"); if (it && !e.target.closest("a")) { openItem(it.dataset.item); return; }
  if (e.target.id === "modal") closeModal();
});

/* ---------------- demo data ---------------- */
function makeDemo() {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const d = Object.fromEntries(COLLS.map(c => [c, []]));
  const sup = [["s1", "Dentalni center (primer)", 2, 150], ["s2", "MediDent trgovina (primer)", 4, 100], ["s3", "Zobni svet (primer)", 3, 200]];
  sup.forEach(([id, name, dd, mo]) => d.suppliers.push({id, name, deliveryDays: dd, minOrder: mo, email: "narocila@primer.si", contact: "Prodaja", web: "www.primer.si"}));
  const items = [
    ["Ubistesin forte 4 % karpule", "Anestetiki", "karpula", 50, 150, 450, 0.68, 14, "s1"],
    ["Septanest 1:100.000 karpule", "Anestetiki", "karpula", 50, 80, 250, 0.61, 6, "s2"],
    ["Kompozit A2, brizga 4 g", "Kompoziti in bonding", "brizga", 1, 4, 10, 38.5, .35, "s1"],
    ["Univerzalni bonding 5 ml", "Kompoziti in bonding", "steklenička", 1, 2, 4, 96, .08, "s3"],
    ["Nitrilne rokavice M", "Zaščitna oprema", "kos", 100, 400, 1500, 0.06, 38, "s2"],
    ["Nitrilne rokavice S", "Zaščitna oprema", "kos", 100, 300, 1000, 0.06, 22, "s2"],
    ["Kirurške maske tip IIR", "Zaščitna oprema", "kos", 50, 150, 500, 0.09, 12, "s2"],
    ["Sesalni nastavki", "Potrošni material", "kos", 100, 200, 800, 0.03, 20, "s3"],
    ["Vatni valjčki št. 2", "Potrošni material", "kos", 500, 500, 2000, 0.008, 45, "s3"],
    ["Endo K-pile 25 mm, 15–40", "Endodontija", "paket", 6, 3, 12, 11.9, .3, "s1"],
    ["Gutaperča 0.04, asort.", "Endodontija", "škatla", 1, 2, 5, 14.2, .12, "s1"],
    ["Alginat 500 g", "Odtisni materiali", "paket", 1, 3, 8, 12.4, .2, "s1"],
    ["Sterilizacijske vrečke 90×230", "Dezinfekcija in sterilizacija", "kos", 200, 200, 800, 0.045, 18, "s3"],
    ["Dezinfekcija površin 1 l", "Dezinfekcija in sterilizacija", "steklenička", 1, 3, 10, 9.8, .25, "s2"],
    ["Polirne paste, profilaksa", "Profilaksa", "tuba", 1, 2, 6, 7.9, .15, "s3"]
  ];
  const now = Date.now(); const iso = t => new Date(t).toISOString().slice(0, 10);
  items.forEach(([name, category, unit, packSize, minQty, targetQty, price, daily, sid], n) => {
    const id = "i" + n; d.items.push({id, name, category, unit, packSize, minQty, targetQty, supplierId: sid, location: ["Omara 1", "Omara 2", "Predal A", "Skladišče"][n % 4], code: "ART-" + (1040 + n * 7)});
    // offers
    d.offers.push({id: "o" + n + "a", itemId: id, supplierId: sid, price: +(price * packSize).toFixed(2), packSize, date: iso(now - (n % 5) * 30 * DAY), url: "https://www.primer.si/izdelek-" + n});
    if (n % 3 !== 2) { const other = sup[(n + 1) % 3][0]; d.offers.push({id: "o" + n + "b", itemId: id, supplierId: other, price: +(price * packSize * (0.9 + rnd() * 0.25)).toFixed(2), packSize, date: iso(now - (n % 4) * 40 * DAY)}); }
    // moves: 180 days weekly
    let stock = 0;
    for (let w = 26; w >= 0; w--) {
      const t = now - w * 7 * DAY;
      if (w % 6 === 0 || stock < minQty) { const q = Math.ceil((targetQty - stock) / packSize) * packSize; if (q > 0) { stock += q; d.moves.push({id: "m" + n + "i" + w, itemId: id, type: "in", qty: q, unitPrice: price, date: iso(t - DAY), supplierId: sid, lot: "L" + (230 + w)}); } }
      const q = Math.max(0, Math.round(daily * 7 * (0.7 + rnd() * 0.6) * 100) / 100 * (unit === "brizga" || unit === "steklenička" || unit === "paket" || unit === "škatla" || unit === "tuba" ? 1 : 1));
      const qq = daily < 1 ? (rnd() < daily * 7 ? 1 : 0) : Math.round(q);
      if (qq > 0 && w > 0) { const take = Math.min(stock, qq); stock -= take; if (take) d.moves.push({id: "m" + n + "o" + w, itemId: id, type: "out", qty: take, unitPrice: price, date: iso(t)}); }
    }
    if (n === 0 || n === 5 || n === 11) stock = Math.round(minQty * 0.6);  // make some low
    if (n === 7) { d.moves.push({id: "m7w", itemId: id, type: "waste", qty: 40, unitPrice: price, date: iso(now - 20 * DAY), lot: "L220"}); }
    const a = Math.round(stock * 0.4), b = stock - a;
    const e1 = n === 1 ? iso(now + 25 * DAY) : n === 12 ? iso(now - 3 * DAY) : iso(now + (120 + n * 30) * DAY);
    if (a > 0) d.lots.push({id: "l" + n + "a", itemId: id, lot: "A" + (4410 + n), expiry: e1, qty: a, price, receivedAt: iso(now - 60 * DAY)});
    if (b > 0) d.lots.push({id: "l" + n + "b", itemId: id, lot: "B" + (5120 + n), expiry: iso(now + (400 + n * 20) * DAY), qty: b, price, receivedAt: iso(now - 10 * DAY)});
  });
  d.orders.push({id: "ord1", supplierId: "s3", status: "sent", sentAt: iso(now - 2 * DAY), createdAt: iso(now - 2 * DAY), lines: [{itemId: "i7", packs: 4, packSize: 100, packPrice: 3, code: ""}, {itemId: "i8", packs: 2, packSize: 500, packPrice: 4, code: ""}]});
  d.orders.push({id: "ord0", supplierId: "s1", status: "received", sentAt: iso(now - 30 * DAY), receivedAt: iso(now - 27 * DAY), createdAt: iso(now - 31 * DAY), lines: [{itemId: "i2", packs: 6, packSize: 1, packPrice: 38.5}]});
  d.settings.push({id: "main", clinic: "Zobna ordinacija (primer)", signature: "Klemen", address: "Primerna ulica 1, 1000 Ljubljana", phone: "01 123 45 67", warnDays: 60, safetyDays: 7, template: DEFAULT_TEMPLATE});
  return d;
}

/* ---------------- login & boot ---------------- */
function showLogin(msg) {
  $("#app").hidden = true; $("#tabbar").hidden = true; $("#fab").hidden = true;
  const box = $("#login"); box.hidden = false;
  if (!SB) { box.innerHTML = `<div class="card"><h1>Zaloga ordinacije</h1><p>Povezava z bazo še ni nastavljena. V datoteko <span class="mono">index.html</span> vpišite SUPABASE_URL in SUPABASE_KEY.</p><button class="btn" data-act="demo-on">Poglej primer</button></div>`; return; }
  box.innerHTML = `<form class="card" id="loginForm"><h1>Zaloga ordinacije</h1><p>Vpišite svoj e-naslov. Poslali vam bomo e-pošto za prijavo – kliknite povezavo v njej ali tukaj vpišite kodo.</p>
    <div class="field"><label for="lg_email">E-pošta</label><input type="email" id="lg_email" required autocomplete="email" value="${esc((() => { try { return localStorage.getItem("zaloga.email") || ""; } catch (e) { return ""; } })())}"></div>
    <div class="field" id="codeField" hidden><label for="lg_code">Koda iz e-pošte (če jo e-pošta vsebuje)</label><input type="text" id="lg_code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" class="mono"></div>
    <div class="err" id="lg_err">${msg ? esc(msg) : ""}</div>
    <button class="btn primary" type="submit" id="lg_btn">Pošlji kodo</button>
    <button class="linkish small" type="button" data-act="demo-on">Poglej primer brez prijave</button></form>`;
  let step = "email";
  $("#loginForm").onsubmit = async e => {
    e.preventDefault(); const email = fv("lg_email").toLowerCase(); $("#lg_err").textContent = ""; $("#lg_btn").disabled = true;
    try { localStorage.setItem("zaloga.email", email); } catch (er) {}
    if (step === "email") {
      const {error} = await SB.auth.signInWithOtp({email, options: {shouldCreateUser: false}});
      $("#lg_btn").disabled = false;
      if (error) { $("#lg_err").textContent = /signups not allowed|not found|Signups/i.test(error.message) ? "Ta e-naslov ni med uporabniki. Prosite skrbnika, da vas doda." : "Pošiljanje ni uspelo: " + error.message; return; }
      step = "code"; $("#codeField").hidden = false; $("#lg_code").focus(); $("#lg_btn").textContent = "Prijava";
    } else {
      const {error} = await SB.auth.verifyOtp({email, token: fv("lg_code"), type: "email"});
      $("#lg_btn").disabled = false;
      if (error) { $("#lg_err").textContent = "Koda ni pravilna ali je potekla. Poskusite znova."; return; }
    }
  };
}
let started = false;
async function start(session) {
  if (started) return; started = true;
  ME = session.user.email.toLowerCase();
  $("#login").hidden = false; $("#login").innerHTML = '<div class="loading">Nalagam podatke …</div>';
  try { await loadAll(); }
  catch (e) { started = false; console.error(e); return showLogin("Podatkov ni bilo mogoče naložiti. Preverite, ali je vaš e-naslov v tabeli članov."); }
  if (!names[ME]) { started = false; await SB.auth.signOut(); return showLogin("Prijava je uspela, a ta e-naslov ni v tabeli članov (members). Skrbnik ga mora dodati."); }
  live = true; demo = false; D = null; render();
  const ch = SB.channel("zaloga");
  COLLS.concat(["members"]).forEach(t => ch.on("postgres_changes", {event: "*", schema: "public", table: t}, p => {
    if (t === "members") { if (p.new && p.new.email) names[p.new.email] = p.new.name || p.new.email; return schedule(); }
    if (p.eventType === "DELETE") { if (p.old && p.old.id) applyLocal(t, {id: p.old.id}, true); }
    else applyLocal(t, fromRow(p.new));
  }));
  ch.subscribe();
  // ob vrnitvi v aplikacijo (npr. telefon iz ozadja) osveži vse
  document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible" && live) { try { await loadAll(); schedule(); } catch (e) {} } });
}
(async function boot() {
  const ok = window.supabase && /^https:\/\//.test(SUPABASE_URL) && SUPABASE_KEY.length > 20;
  if (!ok) return showLogin();
  SB = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth: {persistSession: true, autoRefreshToken: true}});
  const {data} = await SB.auth.getSession();
  SB.auth.onAuthStateChange((ev, session) => { if (session && !started) start(session); });
  if (data.session) start(data.session); else showLogin();
})();
